  <script>
    // ===== State =====
    let cardsData = {};
    let eventsData = {};
    let summaryData = {};
    let deckCounts = {};
    let activeColorFilter = 'all';
    let activeTypeFilter = 'all';
    let charts = {};
    let currentDeck = [];
    let imageRecognizedDeck = null;
    let imageReadyToRecognize = false;
    let imageRecognized = false;

    const COLOR_ORDER = ['Blue', 'Red', 'Green', 'White', 'Purple'];
    const COLOR_HEX = {
      Blue: '#4488ff',
      Red: '#ff4444',
      Green: '#44cc64',
      White: '#cccccc',
      Purple: '#b444ff'
    };

    // ===== Data Loading =====
    async function loadCardsData() {
      try {
        const res = await fetch(GCG.DATA_PATH + 'cards_master.json');
        const data = await res.json();
        Object.values(data).forEach(c => { cardsData[c.id] = c; });
      } catch (e) {
        console.error('cards_master.json の読み込みに失敗:', e);
      }
    }

    // ===== Tab Switching =====
    function switchTab(tab) {
      ['checklist', 'text', 'image'].forEach(t => {
        document.getElementById('tab-' + t).style.display = t === tab ? '' : 'none';
        document.getElementById('tab-btn-' + t).classList.toggle('active', t === tab);
      });
      updateDeckCountDisplay();
      updateEvaluateButton();
    }

    // ===== Filter =====
    function setColorFilter(color, btn) {
      activeColorFilter = color;
      document.querySelectorAll('[data-color]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCardList();
    }

    function setTypeFilter(type, btn) {
      activeTypeFilter = type;
      document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterCardList();
    }

    function filterCardList() {
      const search = (document.getElementById('search-input').value || '').toLowerCase();
      const rows = document.querySelectorAll('.card-row');
      let visible = 0;
      rows.forEach(row => {
        const id = (row.dataset.id || '').toLowerCase();
        const name = (row.dataset.name || '').toLowerCase();
        const color = row.dataset.color;
        const type = row.dataset.type;
        const matchSearch = !search || id.includes(search) || name.includes(search);
        const matchColor = activeColorFilter === 'all' || color === activeColorFilter;
        const matchType = activeTypeFilter === 'all' || type === activeTypeFilter;
        row.style.display = (matchSearch && matchColor && matchType) ? '' : 'none';
        if (matchSearch && matchColor && matchType) visible++;
      });
      document.getElementById('visible-count').textContent = visible;
    }

    // ===== Build Card List =====
    function buildCardList() {
      const container = document.getElementById('card-list-body');
      // Sort by color order, then card_id
      const cards = Object.values(cardsData);
      cards.sort((a, b) => {
        const ci = COLOR_ORDER.indexOf(a.color) - COLOR_ORDER.indexOf(b.color);
        if (ci !== 0) return ci;
        return (a.id || '').localeCompare(b.id || '');
      });

      if (cards.length === 0) {
        container.textContent = 'カードデータがありません';
        document.getElementById('visible-count').textContent = '0';
        return;
      }

      const frag = document.createDocumentFragment();
      cards.forEach(card => {
        const row = document.createElement('div');
        row.className = 'card-row';
        row.dataset.id = card.id;
        row.dataset.name = card.name_jp || '';
        row.dataset.color = card.color || '';
        row.dataset.type = card.card_type || '';

        const colorHex = COLOR_HEX[card.color] || '#888';
        const typeClass = `type-badge type-badge-${card.card_type}`;

        row.innerHTML = `
          <input type="checkbox" id="chk-${card.id}" onchange="onCardCheck('${card.id}', this)">
          <span class="card-id-text">${GCG.escapeHtml(card.id)}</span>
          <span class="card-name-text">${GCG.escapeHtml(card.name_jp || '')}</span>
          <span class="color-dot-small" style="background:${colorHex}" title="${card.color || ''}"></span>
          <span class="${typeClass}">${card.card_type || ''}</span>
          <input type="number" class="card-count-input" id="cnt-${card.id}" min="1" max="4" value="1" disabled
            onchange="onCardCountChange('${card.id}', this)"
            oninput="onCardCountChange('${card.id}', this)">
        `;
        frag.appendChild(row);
      });

      container.innerHTML = '';
      container.appendChild(frag);
      document.getElementById('visible-count').textContent = cards.length;
    }

    function onCardCheck(cardId, cb) {
      const countInput = document.getElementById('cnt-' + cardId);
      if (cb.checked) {
        countInput.disabled = false;
        deckCounts[cardId] = parseInt(countInput.value) || 1;
      } else {
        countInput.disabled = true;
        delete deckCounts[cardId];
      }
      updateDeckCountDisplay();
    }

    function onCardCountChange(cardId, input) {
      const cb = document.getElementById('chk-' + cardId);
      if (cb && cb.checked) {
        const v = parseInt(input.value) || 1;
        deckCounts[cardId] = Math.max(1, Math.min(4, v));
      }
      updateDeckCountDisplay();
    }

    // ===== Text parsing =====
    function parseDeckText(text) {
      const lines = (text || '').split('\n');
      const result = [];
      const warnings = [];
      lines.forEach(line => {
        line = line.trim();
        if (!line) return;
        // Match "CARD-ID:count" or "CARD-ID count" or "CARD-ID　count" (zenkaku space)
        const m = line.match(/^([A-Za-z0-9\-]+)[\s:　]+(\d+)$/) || line.match(/^([A-Za-z0-9\-]+)$/);
        if (!m) return;
        const card_id = m[1].toUpperCase();
        const count = m[2] ? parseInt(m[2]) : 1;
        if (!cardsData[card_id]) {
          warnings.push(card_id);
        }
        result.push({ card_id, count });
      });
      return { deck: result, warnings };
    }

    // ===== Deck helpers =====
    function getCurrentDeck() {
      // カードリストタブ
      if (document.getElementById('tab-checklist').style.display !== 'none') {
        return {
          deck: Object.entries(deckCounts).map(([card_id, count]) => ({ card_id, count: parseInt(count) || 1 })),
          warnings: []
        };
      }
      // 画像認識タブ（認識結果がある場合）
      if (document.getElementById('tab-image').style.display !== 'none' && imageRecognizedDeck) {
        const warnings = [];
        imageRecognizedDeck.forEach(({ card_id }) => {
          if (!cardsData[card_id]) warnings.push(card_id);
        });
        return { deck: imageRecognizedDeck, warnings };
      }
      // テキスト入力タブ（デフォルト）
      return parseDeckText(document.getElementById('deck-text-input').value);
    }

    function updateDeckCountDisplay() {
      let total = 0;
      if (document.getElementById('tab-checklist') && document.getElementById('tab-checklist').style.display !== 'none') {
        total = Object.values(deckCounts).reduce((s, v) => s + (parseInt(v) || 0), 0);
      } else if (document.getElementById('tab-image') && document.getElementById('tab-image').style.display !== 'none' && imageRecognizedDeck) {
        total = imageRecognizedDeck.reduce((s, c) => s + (c.count || 0), 0);
      } else {
        const { deck } = parseDeckText(document.getElementById('deck-text-input') ? document.getElementById('deck-text-input').value : '');
        total = deck.reduce((s, c) => s + (c.count || 0), 0);
      }
      document.getElementById('deck-total-count').textContent = total;
    }

    // ===== Deck type =====
    function determineDeckType(deck) {
      const colors = new Set(deck.map(({ card_id }) => cardsData[card_id]?.color).filter(Boolean));
      const sorted = COLOR_ORDER.filter(c => colors.has(c));
      return {
        colors: sorted,
        type_key: sorted.join('+'),
        label: sorted.map(c => GCG.DECK_COLORS[c]?.jp || c).join('/')
      };
    }

    function getEventDeckTypeKey(deck) {
      const colors = new Set(deck.map(({ card_id }) => cardsData[card_id]?.color).filter(Boolean));
      return COLOR_ORDER.filter(c => colors.has(c)).join('+');
    }

    // ===== Half-month period =====
    function getCurrentHalfMonth() {
      const now = new Date();
      const y = now.getFullYear(), m = now.getMonth() + 1, d = now.getDate();
      const ms = String(m).padStart(2, '0');
      if (d <= 15) {
        return { start: `${y}-${ms}-01`, end: `${y}-${ms}-15`, label: `${y}年${m}月前半` };
      } else {
        const last = new Date(y, m, 0).getDate();
        return { start: `${y}-${ms}-16`, end: `${y}-${ms}-${String(last).padStart(2, '0')}`, label: `${y}年${m}月後半` };
      }
    }

    function filterEventsByHalfMonth(halfMonth) {
      return Object.values(eventsData.events || {}).filter(ev => ev.date >= halfMonth.start && ev.date <= halfMonth.end);
    }

    // ===== Env share / win rate =====
    function calcEnvShare(typeKey, filteredEvents) {
      let totalDecks = 0, sameTypeDecks = 0, totalWins = 0, sameTypeWins = 0;
      (filteredEvents.length > 0 ? filteredEvents : Object.values(eventsData.events || {})).forEach(ev => {
        (ev.results || []).forEach(r => {
          if (r.rank <= 4) {
            totalDecks++;
            const tk = getEventDeckTypeKey(r.deck || []);
            if (tk === typeKey) sameTypeDecks++;
          }
          if (r.rank === 1) {
            totalWins++;
            const tk = getEventDeckTypeKey(r.deck || []);
            if (tk === typeKey) sameTypeWins++;
          }
        });
      });
      return {
        share: totalDecks > 0 ? (sameTypeDecks / totalDecks * 100) : 0,
        winRate: totalWins > 0 ? (sameTypeWins / totalWins * 100) : 0,
        totalDecks,
        sameTypeDecks,
        totalWins,
        sameTypeWins
      };
    }

    // ===== Match rate (Jaccard) =====
    function calcMatchRate(deck, typeKey, filteredEvents) {
      const myCardIds = new Set(deck.map(c => c.card_id));
      let candidateDecks = [];
      const eventsToSearch = filteredEvents.length > 0 ? filteredEvents : Object.values(eventsData.events || {});
      eventsToSearch.forEach(ev => {
        (ev.results || []).forEach(r => {
          if (r.rank <= 4) {
            const tk = getEventDeckTypeKey(r.deck || []);
            if (tk === typeKey) {
              candidateDecks.push({ deck: r.deck || [], event: ev, rank: r.rank });
            }
          }
        });
      });
      if (candidateDecks.length === 0) return { matchRate: 0, matchCount: 0, total: 0, bestDeck: null };

      let bestJaccard = 0, bestMatch = 0, bestTotal = 0, bestDeck = null;
      candidateDecks.forEach(({ deck: cd, event, rank }) => {
        const theirIds = new Set(cd.map(c => c.card_id));
        const intersection = new Set([...myCardIds].filter(x => theirIds.has(x)));
        const union = new Set([...myCardIds, ...theirIds]);
        const j = union.size > 0 ? intersection.size / union.size : 0;
        if (j > bestJaccard) {
          bestJaccard = j;
          bestMatch = intersection.size;
          bestTotal = union.size;
          bestDeck = { deck: cd, event, rank };
        }
      });
      return {
        matchRate: bestJaccard * 100,
        matchCount: bestMatch,
        total: bestTotal,
        bestDeck,
        candidateCount: candidateDecks.length
      };
    }

    // ===== Chart helpers =====
    function destroyChart(key) {
      if (charts[key]) {
        charts[key].destroy();
        delete charts[key];
      }
    }

    function chartDefaults() {
      return {
        plugins: {
          legend: {
            labels: {
              color: '#aaa',
              font: { family: "'JetBrains Mono', monospace", size: 11 }
            }
          },
          tooltip: {
            callbacks: {}
          }
        },
        scales: {}
      };
    }

    function darkBarScales() {
      return {
        x: {
          ticks: { color: '#888', font: { family: "'JetBrains Mono', monospace", size: 11 } },
          grid: { color: '#333' }
        },
        y: {
          ticks: { color: '#888', font: { family: "'JetBrains Mono', monospace", size: 11 } },
          grid: { color: '#333' }
        }
      };
    }

    // ===== Image Recognition =====
    const WORKER_URL = 'https://gcg-deck-reader.kariumu19.workers.dev';

    function updateEvaluateButton() {
      const btn = document.getElementById('evaluate-btn');
      const imageTabVisible = document.getElementById('tab-image').style.display !== 'none';
      if (imageTabVisible && imageReadyToRecognize && !imageRecognized) {
        btn.textContent = '画像を読み込む';
        btn.onclick = recognizeImage;
      } else {
        btn.textContent = 'デッキを評価する';
        btn.onclick = evaluateDeck;
      }
    }

    async function handleImageUpload(input) {
      const file = input.files[0];
      if (!file) return;
      const preview = document.getElementById('image-preview');
      const status = document.getElementById('image-status');

      // プレビュー表示のみ
      const reader = new FileReader();
      reader.onload = function(e) {
        preview.innerHTML = '<img src="' + e.target.result + '" style="max-width:100%;max-height:300px;border-radius:6px;border:1px solid var(--border)">';
      };
      reader.readAsDataURL(file);

      // 状態を更新（APIはまだ呼ばない）
      imageReadyToRecognize = true;
      imageRecognized = false;
      imageRecognizedDeck = null;
      status.textContent = '画像が選択されました。「画像を読み込む」ボタンを押してください。';
      status.style.color = 'var(--text-muted)';

      updateEvaluateButton();
      updateDeckCountDisplay();
    }

    async function recognizeImage() {
      const input = document.getElementById('deck-image-input');
      const file = input.files[0];
      if (!file) {
        alert('画像が選択されていません。');
        return;
      }

      const status = document.getElementById('image-status');
      const btn = document.getElementById('evaluate-btn');

      btn.disabled = true;
      btn.textContent = '読み取り中...';
      status.textContent = '画像を読み取り中...（10〜20秒かかります）';
      status.style.color = 'var(--text-muted)';

      try {
        const base64 = await fileToBase64(file);
        const response = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image_base64: base64, media_type: file.type || 'image/png' })
        });
        const data = await response.json();

        if (data.error) {
          status.textContent = '読み取りエラー: ' + data.error;
          status.style.color = '#ff5050';
          btn.disabled = false;
          updateEvaluateButton();
          return;
        }

        if (data.cards && data.cards.length > 0) {
          const sorted = sortDeckCards(data.cards);
          imageRecognizedDeck = sorted;
          imageRecognized = true;
          imageReadyToRecognize = false;

          // テキスト入力欄にも反映
          document.getElementById('deck-text-input').value = sorted.map(c => c.card_id + ':' + c.count).join('\n');
          updateDeckCountDisplay();

          const totalCards = sorted.reduce((s, c) => s + c.count, 0);
          if (totalCards !== 50) {
            status.innerHTML = '読み取り完了: ' + sorted.length + '種 ' + totalCards + '枚<br>' +
              '<span style="color:#ff8800;font-weight:600">⚠ 合計が50枚ではありません。「B. テキスト入力」タブで枚数を修正できます。</span>';
            status.style.color = 'var(--accent)';
          } else {
            status.textContent = '読み取り完了: ' + sorted.length + '種 ' + totalCards + '枚。「デッキを評価する」を押してください。';
            status.style.color = 'var(--accent)';
          }
        } else {
          status.textContent = 'カードを検出できませんでした。画像を確認してください。';
          status.style.color = '#ff5050';
        }
      } catch (error) {
        status.textContent = 'エラー: ' + error.message;
        status.style.color = '#ff5050';
      }

      btn.disabled = false;
      updateEvaluateButton();
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function sortDeckCards(cards) {
      const colorOrder = { 'Blue': 0, 'Red': 1, 'Green': 2, 'White': 3, 'Purple': 4 };
      const typeOrder = { 'UNIT': 0, 'PILOT': 1, 'COMMAND': 2, 'BASE': 3 };
      return [...cards].sort((a, b) => {
        const cA = cardsData[a.card_id], cB = cardsData[b.card_id];
        const colDiff = (colorOrder[cA?.color] ?? 9) - (colorOrder[cB?.color] ?? 9);
        if (colDiff !== 0) return colDiff;
        const typeDiff = (typeOrder[cA?.card_type] ?? 9) - (typeOrder[cB?.card_type] ?? 9);
        if (typeDiff !== 0) return typeDiff;
        const costDiff = (cB?.cost ?? 0) - (cA?.cost ?? 0);
        if (costDiff !== 0) return costDiff;
        return a.card_id.localeCompare(b.card_id);
      });
    }

    // ===== Evaluate =====
    async function evaluateDeck() {
      const { deck, warnings } = getCurrentDeck();
      if (deck.length === 0) {
        alert('デッキにカードを追加してください。');
        return;
      }

      const btn = document.getElementById('evaluate-btn');
      btn.disabled = true;
      btn.textContent = '評価中...';

      try {
        await renderResults(deck, warnings);
      } finally {
        btn.disabled = false;
        btn.textContent = 'デッキを評価する';
      }
    }

    async function renderResults(deck, warnings) {
      currentDeck = deck;
      const deckType = determineDeckType(deck);
      const halfMonth = getCurrentHalfMonth();
      const filteredEvents = filterEventsByHalfMonth(halfMonth);
      const envStats = calcEnvShare(deckType.type_key, filteredEvents);
      const matchResult = calcMatchRate(deck, deckType.type_key, filteredEvents);

      // Show deck card grid above results
      const gridContainer = document.getElementById('deck-card-grid-container');
      gridContainer.innerHTML = '';
      gridContainer.appendChild(renderDeckCardList(deck));

      // Show results section
      document.getElementById('results-section').style.display = '';

      // Scroll to results
      document.getElementById('deck-card-grid-container').scrollIntoView({ behavior: 'smooth', block: 'start' });

      // --- Summary grid ---
      const totalCards = deck.reduce((s, c) => s + c.count, 0);
      const summaryGrid = document.getElementById('result-summary-grid');
      summaryGrid.innerHTML = `
        <div class="result-stat-card">
          <div class="result-stat-value">${totalCards}</div>
          <div class="result-stat-label">総枚数</div>
        </div>
        <div class="result-stat-card">
          <div class="result-stat-value">${deck.length}</div>
          <div class="result-stat-label">種類数</div>
        </div>
        <div class="result-stat-card">
          <div class="result-stat-value">${deckType.label || '不明'}</div>
          <div class="result-stat-label">デッキタイプ</div>
        </div>
        <div class="result-stat-card">
          <div class="result-stat-value">${envStats.share.toFixed(1)}%</div>
          <div class="result-stat-label">環境シェア</div>
        </div>
        <div class="result-stat-card">
          <div class="result-stat-value">${envStats.winRate.toFixed(1)}%</div>
          <div class="result-stat-label">優勝率</div>
        </div>
        <div class="result-stat-card">
          <div class="result-stat-value">${matchResult.matchRate.toFixed(1)}%</div>
          <div class="result-stat-label">入賞一致率</div>
        </div>
      `;

      // --- Charts ---
      renderCharts(deck);

      // --- Text evaluation ---
      renderEvalText(deck, deckType, halfMonth, envStats, matchResult, warnings);
    }

    function renderCharts(deck) {
      const chartsGrid = document.getElementById('charts-grid');
      chartsGrid.innerHTML = '';

      const chartDefs = [
        { key: 'type', title: 'カードタイプ別' },
        { key: 'level', title: 'レベル別' },
        { key: 'cost', title: 'コスト別' },
        { key: 'color', title: '色別' },
        { key: 'traits', title: '特徴別 TOP15' },
        { key: 'link', title: 'UNIT/PILOT 特徴重複' },
        { key: 'ap', title: 'AP別 (UNITのみ)' },
        { key: 'hp', title: 'HP別 (UNIT/BASE)' },
        { key: 'keyword', title: '効果キーワード別' },
        { key: 'timing', title: '発動タイミング別' }
      ];

      chartDefs.forEach(def => {
        const card = document.createElement('div');
        card.className = 'chart-card';
        card.innerHTML = `<div class="chart-title">${def.title}</div><div class="chart-canvas-wrap"><canvas id="chart-${def.key}"></canvas></div>`;
        chartsGrid.appendChild(card);
      });

      // Destroy old charts
      Object.keys(charts).forEach(k => destroyChart(k));

      // 1. Card type pie
      buildTypeChart(deck);
      // 2. Level bar
      buildLevelChart(deck);
      // 3. Cost bar
      buildCostChart(deck);
      // 4. Color pie
      buildColorChart(deck);
      // 5. Traits bar
      buildTraitsChart(deck);
      // 6. Link traits bar
      buildLinkChart(deck);
      // 7. AP bar
      buildApChart(deck);
      // 8. HP bar
      buildHpChart(deck);
      // 9. Effect keyword bar
      buildKeywordChart(deck);
      // 11. Timing bar
      buildTimingChart(deck);
    }

    function buildTypeChart(deck) {
      const counts = { UNIT: 0, PILOT: 0, COMMAND: 0, BASE: 0 };
      deck.forEach(({ card_id, count }) => {
        const card = cardsData[card_id];
        if (card && counts[card.card_type] !== undefined) counts[card.card_type] += count;
      });
      const ctx = document.getElementById('chart-type').getContext('2d');
      charts['type'] = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: ['UNIT', 'PILOT', 'COMMAND', 'BASE'],
          datasets: [{
            data: [counts.UNIT, counts.PILOT, counts.COMMAND, counts.BASE],
            backgroundColor: ['#4d9ff7aa', '#34d058aa', '#d4a029aa', '#888888aa'],
            borderColor: ['#4d9ff7', '#34d058', '#d4a029', '#888888'],
            borderWidth: 1
          }]
        },
        options: { ...chartDefaults(), responsive: true, maintainAspectRatio: false }
      });
    }

    function buildLevelChart(deck) {
      const labels = ['1', '2', '3', '4', '5', '6', '7+'];
      const vals = new Array(7).fill(0);
      deck.forEach(({ card_id, count }) => {
        const card = cardsData[card_id];
        if (!card) return;
        const lv = parseInt(card.level) || 0;
        const idx = Math.min(lv - 1, 6);
        if (idx >= 0) vals[idx] += count;
      });
      const ctx = document.getElementById('chart-level').getContext('2d');
      charts['level'] = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: '枚数',
            data: vals,
            backgroundColor: '#d4a02966',
            borderColor: '#d4a029',
            borderWidth: 1
          }]
        },
        options: {
          ...chartDefaults(),
          responsive: true, maintainAspectRatio: false,
          scales: darkBarScales(),
          plugins: { legend: { display: false } }
        }
      });
    }

    function buildCostChart(deck) {
      const labels = ['0', '1', '2', '3', '4', '5', '6', '7+'];
      const vals = new Array(8).fill(0);
      deck.forEach(({ card_id, count }) => {
        const card = cardsData[card_id];
        if (!card) return;
        const cost = parseInt(card.cost) || 0;
        const idx = Math.min(cost, 7);
        vals[idx] += count;
      });
      const ctx = document.getElementById('chart-cost').getContext('2d');
      charts['cost'] = new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: '枚数',
            data: vals,
            backgroundColor: '#4d9ff766',
            borderColor: '#4d9ff7',
            borderWidth: 1
          }]
        },
        options: {
          ...chartDefaults(),
          responsive: true, maintainAspectRatio: false,
          scales: darkBarScales(),
          plugins: { legend: { display: false } }
        }
      });
    }

    function buildColorChart(deck) {
      const counts = {};
      deck.forEach(({ card_id, count }) => {
        const card = cardsData[card_id];
        if (!card || !card.color) return;
        counts[card.color] = (counts[card.color] || 0) + count;
      });
      const colors = COLOR_ORDER.filter(c => counts[c]);
      const ctx = document.getElementById('chart-color').getContext('2d');
      charts['color'] = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: colors.map(c => GCG.DECK_COLORS[c]?.jp || c),
          datasets: [{
            data: colors.map(c => counts[c]),
            backgroundColor: colors.map(c => (COLOR_HEX[c] || '#888') + 'aa'),
            borderColor: colors.map(c => COLOR_HEX[c] || '#888'),
            borderWidth: 1
          }]
        },
        options: { ...chartDefaults(), responsive: true, maintainAspectRatio: false }
      });
    }

    function buildTraitsChart(deck) {
      const traitCounts = {};
      deck.forEach(({ card_id, count }) => {
        const card = cardsData[card_id];
        if (!card || !card.traits) return;
        card.traits.forEach(t => {
          traitCounts[t] = (traitCounts[t] || 0) + count;
        });
      });
      const sorted = Object.entries(traitCounts).sort((a, b) => b[1] - a[1]).slice(0, 15);
      const ctx = document.getElementById('chart-traits').getContext('2d');
      charts['traits'] = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: sorted.map(([t]) => t),
          datasets: [{
            label: '枚数',
            data: sorted.map(([, v]) => v),
            backgroundColor: '#b444ff66',
            borderColor: '#b444ff',
            borderWidth: 1
          }]
        },
        options: {
          ...chartDefaults(),
          indexAxis: 'y',
          responsive: true, maintainAspectRatio: false,
          scales: darkBarScales(),
          plugins: { legend: { display: false } }
        }
      });
    }

    function buildLinkChart(deck) {
      const unitTraits = new Set();
      const pilotTraits = new Set();
      deck.forEach(({ card_id }) => {
        const card = cardsData[card_id];
        if (!card || !card.traits) return;
        if (card.card_type === 'UNIT') card.traits.forEach(t => unitTraits.add(t));
        if (card.card_type === 'PILOT') card.traits.forEach(t => pilotTraits.add(t));
      });
      const shared = [...unitTraits].filter(t => pilotTraits.has(t));
      // Count how many of each shared trait appear in the deck
      const traitCounts = {};
      deck.forEach(({ card_id, count }) => {
        const card = cardsData[card_id];
        if (!card || !card.traits) return;
        if (card.card_type === 'UNIT' || card.card_type === 'PILOT') {
          card.traits.forEach(t => {
            if (shared.includes(t)) traitCounts[t] = (traitCounts[t] || 0) + count;
          });
        }
      });
      const sorted = Object.entries(traitCounts).sort((a, b) => b[1] - a[1]).slice(0, 10);
      const ctx = document.getElementById('chart-link').getContext('2d');
      charts['link'] = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: sorted.length > 0 ? sorted.map(([t]) => t) : ['なし'],
          datasets: [{
            label: '枚数',
            data: sorted.length > 0 ? sorted.map(([, v]) => v) : [0],
            backgroundColor: '#34d05866',
            borderColor: '#34d058',
            borderWidth: 1
          }]
        },
        options: {
          ...chartDefaults(),
          indexAxis: 'y',
          responsive: true, maintainAspectRatio: false,
          scales: darkBarScales(),
          plugins: { legend: { display: false } }
        }
      });
    }

    function countEffectTags(deck) {
      const tagLabels = {
        damage: 'ダメージ付与', destroy: '除去（破壊）', rest: 'レスト',
        active: 'アクティブ', draw: 'ドロー', bounce: 'バウンス',
        cost_down: 'コスト軽減', damage_reduce: 'ダメージ軽減',
        search: 'サーチ', trash_use: 'トラッシュ利用', token: 'トークン',
        stat_buff: 'ステータス上昇', stat_debuff: 'ステータス低下',
        repair: '《リペア》', breakthrough: '《突破》', support: '《援護》',
        blocker: '《ブロッカー》', first_strike: '《先制攻撃》',
        high_mobility: '《高機動》', suppression: '《制圧》'
      };
      const counts = {};
      for (const tag in tagLabels) counts[tag] = 0;
      deck.forEach(({ card_id, count }) => {
        const card = cardsData[card_id];
        if (!card || !card.effect_tags) return;
        card.effect_tags.forEach(tag => { if (tag in counts) counts[tag] += count; });
      });
      return Object.entries(counts)
        .filter(([_, v]) => v > 0)
        .sort((a, b) => b[1] - a[1])
        .map(([tag, count]) => ({ tag, label: tagLabels[tag], count }));
    }

    function countTimingTags(deck) {
      const timingLabels = {
        on_deploy: '【配備時】', on_attack: '【アタック時】', on_destroy: '【破壊時】',
        burst: '【バースト】', activate_main: '【起動・メイン】',
        activate_action: '【起動・アクション】', main: '【メイン】', action: '【アクション】',
        on_set: '【セット時】', while_set: '【セット中】',
        on_link: '【リンク時】', while_link: '【リンク中】',
        once_per_turn: '【ターン1回】', has_pilot: '【パイロット】'
      };
      const counts = {};
      for (const tag in timingLabels) counts[tag] = 0;
      deck.forEach(({ card_id, count }) => {
        const card = cardsData[card_id];
        if (!card || !card.effect_tags) return;
        card.effect_tags.forEach(tag => { if (tag in counts) counts[tag] += count; });
      });
      return Object.entries(counts)
        .filter(([_, v]) => v > 0)
        .sort((a, b) => b[1] - a[1])
        .map(([tag, count]) => ({ tag, label: timingLabels[tag], count }));
    }

    // ===== Text evaluation =====
    function renderEvalText(deck, deckType, halfMonth, envStats, matchResult, warnings) {
      const container = document.getElementById('eval-text-section');
      container.innerHTML = '';

      // Warnings for unknown cards
      if (warnings && warnings.length > 0) {
        const warnDiv = document.createElement('div');
        warnDiv.className = 'text-warn';
        warnDiv.textContent = `不明なカードID: ${warnings.join(', ')} (データなし - 評価に含めましたが正確でない場合があります)`;
        container.appendChild(warnDiv);
      }

      // Find summary data for this deck type
      const deckTypeData = (summaryData.deck_type_ranking || []).find(dt => dt.type_key === deckType.type_key);

      // --- Section 1: 基本情報 ---
      const sec1 = createEvalSection('基本情報');
      addEvalItem(sec1, 'デッキタイプ', `"${deckType.label || '不明'}"`, null);
      addEvalItem(sec1, `環境シェア（${halfMonth.label}）`,
        `${envStats.share.toFixed(1)}%`,
        `基準: 半月以内のTOP4デッキ ${envStats.totalDecks}件中 ${envStats.sameTypeDecks}件が同タイプ${filteredEventsEmpty(halfMonth) ? '（期間内データなし・全期間で代替）' : ''}`
      );
      addEvalItem(sec1, `優勝率（${halfMonth.label}）`,
        `${envStats.winRate.toFixed(1)}%`,
        `${envStats.totalWins}件の優勝中 ${envStats.sameTypeWins}件が同タイプ`
      );
      container.appendChild(sec1);

      // --- Section 2: 入賞一致率 ---
      const sec2 = createEvalSection('入賞構成との一致率');
      if (matchResult.bestDeck) {
        const bd = matchResult.bestDeck;
        addEvalItem(sec2, 'Jaccard係数（一致率）',
          `${matchResult.matchRate.toFixed(1)}%`,
          `比較対象: ${bd.event?.date || '不明'} ${bd.event?.store || ''} ${GCG.rankText(bd.rank)} (${matchResult.candidateCount}件中最高一致)`
        );
        addEvalItem(sec2, '一致カード数', `${matchResult.matchCount}種 / ${matchResult.total}種`);

        // Synergy level label
        let synergyLabel;
        if (matchResult.matchRate >= 70) synergyLabel = '<span class="ok-tag">高一致</span>';
        else if (matchResult.matchRate >= 40) synergyLabel = '<span class="ok-tag">中一致</span>';
        else synergyLabel = '<span class="warn-tag">低一致</span>';
        const evalItemEl = sec2.querySelector('.eval-item:last-child');
        if (evalItemEl) {
          const valEl = evalItemEl.querySelector('.eval-value');
          if (valEl) valEl.innerHTML += synergyLabel;
        }
      } else {
        addEvalItem(sec2, '一致率', '---', `同タイプの入賞デッキが見つかりません（${matchResult.candidateCount || 0}件）`);
      }
      container.appendChild(sec2);

      // --- Section 3: カード採用率 ---
      const sec3 = createEvalSection('カード採用率（同タイプとの比較）');
      if (deckTypeData && deckTypeData.card_ranking && deckTypeData.card_ranking.length > 0) {
        const rankMap = {};
        deckTypeData.card_ranking.forEach(cr => { rankMap[cr.card_id] = cr; });
        const tableHtml = buildUsageTable(deck, rankMap);
        const div = document.createElement('div');
        div.innerHTML = tableHtml;
        sec3.appendChild(div);
      } else {
        addEvalItem(sec3, '', `同タイプ（${deckType.label}）の採用率データがありません`);
      }
      container.appendChild(sec3);

      // --- Section 4: 標準構成から外れているカード ---
      const sec4 = createEvalSection('標準構成から外れているカード');
      if (deckTypeData && deckTypeData.card_ranking && deckTypeData.card_ranking.length > 0) {
        const rankMap = {};
        deckTypeData.card_ranking.forEach(cr => { rankMap[cr.card_id] = cr; });
        const offMeta = deck.filter(({ card_id }) => {
          const cr = rankMap[card_id];
          return !cr || cr.usage_rate < 10;
        });
        if (offMeta.length === 0) {
          addEvalItem(sec4, '', '全カードが標準構成の採用率10%以上に含まれています');
        } else {
          const subtitle = document.createElement('div');
          subtitle.style.cssText = 'font-size:12px;color:var(--text-muted);margin-bottom:8px';
          subtitle.textContent = '採用率10%未満のカード';
          sec4.appendChild(subtitle);

          const list = document.createElement('div');
          list.style.cssText = 'display:flex;flex-direction:column;gap:8px';

          offMeta.forEach(({ card_id, count }) => {
            const card = cardsData[card_id];
            const cr = rankMap[card_id];
            const rate = cr ? cr.usage_rate.toFixed(1) : '0.0';

            const row = document.createElement('div');
            row.style.cssText = 'display:flex;align-items:center;gap:10px;padding:8px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:6px';

            const img = document.createElement('img');
            img.src = 'images/cards/' + card_id + '.webp';
            img.alt = card ? card.name_jp : card_id;
            img.style.cssText = 'width:36px;border-radius:3px;flex-shrink:0';
            img.onerror = function() { this.style.display = 'none'; };
            row.appendChild(img);

            const info = document.createElement('div');
            info.style.cssText = 'flex:1;font-size:12px;font-family:var(--font-mono)';
            info.innerHTML =
              '<div style="color:var(--text-primary);font-weight:600">' + (card ? card.name_jp : '不明') + ' <span style="color:var(--text-muted)">(' + card_id + ')</span></div>' +
              '<div style="color:var(--text-muted);margin-top:2px">' + count + '枚投入 / 同タイプ内採用率 ' + rate + '%</div>';
            row.appendChild(info);

            const badge = document.createElement('span');
            if (!cr || cr.usage_rate === 0) {
              badge.style.cssText = 'background:rgba(120,120,120,0.2);color:#888;font-size:10px;padding:2px 6px;border-radius:3px;font-family:var(--font-mono);flex-shrink:0';
              badge.textContent = '実績なし';
            } else {
              badge.style.cssText = 'background:rgba(255,80,80,0.15);color:#ff5050;font-size:10px;padding:2px 6px;border-radius:3px;font-family:var(--font-mono);flex-shrink:0';
              badge.textContent = '低採用';
            }
            row.appendChild(badge);

            list.appendChild(row);
          });

          sec4.appendChild(list);
        }
      } else {
        addEvalItem(sec4, '', 'データなし');
      }
      container.appendChild(sec4);

      // --- Section 5: 平均分布との比較 ---
      const sec5 = createEvalSection('平均分布との比較');
      const myAvgCost = calcAvgCost(deck);
      let costLabel;
      if (deckTypeData) {
        // Estimate env avg cost from card_ranking
        const envDecks = getEnvDecksForType(deckType.type_key);
        const envAvgCost = calcEnvAvgCost(envDecks);
        if (envAvgCost !== null) {
          const diff = myAvgCost - envAvgCost;
          if (Math.abs(diff) < 0.2) costLabel = '環境平均と同等のコスト構成';
          else if (diff > 0) costLabel = `平均より重いコスト構成（+${diff.toFixed(2)}）`;
          else costLabel = `軽量化されたデッキ（${diff.toFixed(2)}）`;
          addEvalItem(sec5, '平均コスト比較',
            costLabel,
            `このデッキの平均コスト: ${myAvgCost.toFixed(2)} / 環境平均: ${envAvgCost.toFixed(2)}`
          );
        } else {
          addEvalItem(sec5, '平均コスト', `このデッキの平均コスト: ${myAvgCost.toFixed(2)}`);
        }
      } else {
        addEvalItem(sec5, '平均コスト', `このデッキの平均コスト: ${myAvgCost.toFixed(2)}`);
      }
      container.appendChild(sec5);

      // --- Section 6: 特徴統一度 ---
      const sec6 = createEvalSection('特徴統一度');
      const unitTraits = new Set();
      const pilotTraits = new Set();
      deck.forEach(({ card_id }) => {
        const card = cardsData[card_id];
        if (!card || !card.traits) return;
        if (card.card_type === 'UNIT') card.traits.forEach(t => unitTraits.add(t));
        if (card.card_type === 'PILOT') card.traits.forEach(t => pilotTraits.add(t));
      });
      const sharedTraits = [...unitTraits].filter(t => pilotTraits.has(t));
      let synergyLevel;
      if (sharedTraits.length >= 3) synergyLevel = '高シナジー';
      else if (sharedTraits.length >= 1) synergyLevel = '中シナジー';
      else synergyLevel = '低シナジー';
      addEvalItem(sec6,
        'UNIT/PILOTの特徴一致',
        `${sharedTraits.length}種 (${synergyLevel})`,
        sharedTraits.length > 0 ? `共通特徴: ${sharedTraits.join('、')}` : 'UNITとPILOT間で共通する特徴なし'
      );
      container.appendChild(sec6);
    }

    function filteredEventsEmpty(halfMonth) {
      return filterEventsByHalfMonth(halfMonth).length === 0;
    }

    function createEvalSection(title) {
      const sec = document.createElement('div');
      sec.className = 'eval-section';
      sec.innerHTML = `<h3>${GCG.escapeHtml(title)}</h3>`;
      return sec;
    }

    function addEvalItem(sec, label, value, note) {
      const item = document.createElement('div');
      item.className = 'eval-item';
      item.innerHTML = `
        ${label ? `<div class="eval-label">${GCG.escapeHtml(label)}</div>` : ''}
        <div class="eval-value">${GCG.escapeHtml(String(value))}</div>
        ${note ? `<div class="eval-note">${GCG.escapeHtml(note)}</div>` : ''}
      `;
      sec.appendChild(item);
    }

    function buildUsageTable(deck, rankMap) {
      const rows = deck.map(({ card_id, count }) => {
        const card = cardsData[card_id];
        const cr = rankMap[card_id];
        const usageRate = cr ? cr.usage_rate : 0;
        const avgCount = cr ? cr.avg_count.toFixed(1) : '0';
        return { card_id, name: card?.name_jp || '不明', count, usageRate, avgCount };
      }).sort((a, b) => b.usageRate - a.usageRate);

      const rowsHtml = rows.map(r => {
        const barWidth = Math.min(100, r.usageRate).toFixed(1);
        return `<tr>
          <td>${GCG.escapeHtml(r.card_id)}</td>
          <td>${GCG.escapeHtml(r.name)}</td>
          <td style="text-align:right">${r.count}</td>
          <td style="text-align:right">${r.avgCount}</td>
          <td>
            <div>${r.usageRate.toFixed(1)}%</div>
            <div class="usage-bar"><div class="usage-bar-fill" style="width:${barWidth}%"></div></div>
          </td>
        </tr>`;
      }).join('');

      return `<table class="card-usage-table">
        <thead><tr>
          <th>カードID</th>
          <th>カード名</th>
          <th>採用枚数</th>
          <th>平均枚数</th>
          <th>採用率</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>`;
    }

    function calcAvgCost(deck) {
      let total = 0, count = 0;
      deck.forEach(({ card_id, count: c }) => {
        const card = cardsData[card_id];
        if (!card) return;
        total += (parseInt(card.cost) || 0) * c;
        count += c;
      });
      return count > 0 ? total / count : 0;
    }

    function getEnvDecksForType(typeKey) {
      const decks = [];
      Object.values(eventsData.events || {}).forEach(ev => {
        (ev.results || []).forEach(r => {
          if (r.rank <= 4) {
            const tk = getEventDeckTypeKey(r.deck || []);
            if (tk === typeKey) decks.push(r.deck || []);
          }
        });
      });
      return decks;
    }

    function calcEnvAvgCost(decks) {
      if (decks.length === 0) return null;
      let total = 0, count = 0;
      decks.forEach(deck => {
        deck.forEach(({ card_id, count: c }) => {
          const card = cardsData[card_id];
          if (!card) return;
          total += (parseInt(card.cost) || 0) * (c || 1);
          count += (c || 1);
        });
      });
      return count > 0 ? total / count : null;
    }

    // ===== Text input live count =====
    document.addEventListener('DOMContentLoaded', function() {
      const textarea = document.getElementById('deck-text-input');
      if (textarea) {
        textarea.addEventListener('input', updateDeckCountDisplay);
      }
    });

    // ===== Init =====
    async function init() {
      GCG.init();
      document.getElementById('header').innerHTML = GCG.renderHeader('deck');
      document.getElementById('footer').innerHTML = GCG.renderFooter();

      await Promise.all([
        loadCardsData(),
        GCG.loadEvents().then(d => { eventsData = d; }),
        GCG.loadSummary().then(d => { summaryData = d; })
      ]);

      buildCardList();
      updateDeckCountDisplay();
    }

    init();
  </script>
</body>
</html>
