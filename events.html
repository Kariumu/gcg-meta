<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3MY17P4E7F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3MY17P4E7F');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント一覧 - GCG STATS</title>
  <meta name="description" content="ガンダムカードゲーム公式大会の全イベント結果一覧。TOP4入賞者のデッキ情報を掲載。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="header"></div>

  <main class="container">
    <div class="section-header">
      <h1 class="section-title">イベント一覧</h1>
      <span class="section-badge" id="event-count">--</span>
    </div>

    <div class="filter-bar">
      <input type="text" class="filter-input" id="search-input" placeholder="店舗名・プレイヤー名で検索...">
      <select class="filter-select" id="date-filter">
        <option value="">全日付</option>
      </select>
    </div>

    <div class="event-list" id="events-list">
      <div class="loading">データを読み込み中</div>
    </div>

    <div class="pagination" id="pagination"></div>
  </main>

  <div id="footer"></div>

  <script src="js/common.js?v=2"></script>
  <script>
    GCG.init();

    const ITEMS_PER_PAGE = 30;
    let allEvents = [];
    let filteredEvents = [];
    let currentPage = 1;

    async function init() {
      const data = await GCG.loadEvents();
      allEvents = GCG.sortedEvents(data.events);

      // 日付フィルタの選択肢を生成
      const dates = [...new Set(allEvents.map(e => e.date?.substring(0, 7)))].filter(Boolean).sort().reverse();
      const dateFilter = document.getElementById('date-filter');
      dates.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d.replace('-', '年') + '月';
        dateFilter.appendChild(opt);
      });

      applyFilters();
    }

    function applyFilters() {
      const searchText = document.getElementById('search-input').value.toLowerCase();
      const dateVal = document.getElementById('date-filter').value;

      filteredEvents = allEvents.filter(ev => {
        if (dateVal && !ev.date?.startsWith(dateVal)) return false;
        if (searchText) {
          const haystack = [
            ev.store,
            ...(ev.results || []).filter(r => r.rank <= 4).map(r => r.player)
          ].join(' ').toLowerCase();
          if (!haystack.includes(searchText)) return false;
        }
        return true;
      });

      currentPage = 1;
      render();
    }

    function render() {
      document.getElementById('event-count').textContent = `${filteredEvents.length}件`;

      const start = (currentPage - 1) * ITEMS_PER_PAGE;
      const pageEvents = filteredEvents.slice(start, start + ITEMS_PER_PAGE);

      const container = document.getElementById('events-list');
      container.innerHTML = pageEvents.map(ev => {
        const top4 = (ev.top4_colors || []).sort((a, b) => a.rank - b.rank);
        const top4Html = top4.map((t, i) => {
          const rankLabel = t.rank === 1 ? '優勝' : t.rank === 2 ? '準優勝' : t.rank + '位';
          const sep = i > 0 ? '<span style="color:var(--border);margin:0 2px">|</span>' : '';
          return `${sep}<span style="display:inline-flex;align-items:center;gap:2px;font-size:11px">
            <span style="color:var(--text-muted);font-family:var(--font-mono);min-width:32px">${rankLabel}</span>
            ${GCG.renderColorDots(t.colors)}
          </span>`;
        }).join('');
        return `
          <a href="event.html?id=${ev.event_id}" class="event-card">
            <span class="event-date">${GCG.formatDate(ev.date)}</span>
            <span class="event-store">${GCG.escapeHtml(ev.store)}</span>
            <span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
              ${top4Html || '<span style="color:var(--text-muted);font-size:11px">データなし</span>'}
            </span>
          </a>`;
      }).join('');

      if (pageEvents.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:48px;color:var(--text-muted);font-size:13px">該当するイベントがありません</div>';
      }

      // ページネーション
      const totalPages = Math.ceil(filteredEvents.length / ITEMS_PER_PAGE);
      const pag = document.getElementById('pagination');
      if (totalPages <= 1) {
        pag.innerHTML = '';
        return;
      }
      let html = '';
      if (currentPage > 1) html += `<button onclick="goPage(${currentPage - 1})">←</button>`;
      for (let i = 1; i <= totalPages; i++) {
        if (totalPages > 10 && Math.abs(i - currentPage) > 2 && i > 2 && i < totalPages - 1) {
          if (i === currentPage - 3 || i === currentPage + 3) html += '<button disabled>...</button>';
          continue;
        }
        html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
      }
      if (currentPage < totalPages) html += `<button onclick="goPage(${currentPage + 1})">→</button>`;
      pag.innerHTML = html;
    }

    function goPage(p) {
      currentPage = p;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('search-input').addEventListener('input', applyFilters);
    document.getElementById('date-filter').addEventListener('change', applyFilters);

    document.getElementById('header').innerHTML = GCG.renderHeader('events');
    document.getElementById('footer').innerHTML = GCG.renderFooter();

    init();
  </script>
</body>
</html>
