  <meta charset="UTF-8">

  <!-- OGP -->
  <meta property="og:site_name" content="GCG STATS">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="イベント一覧 | GCG STATS">
  <meta property="og:description" content="ガンダムカードゲーム ニュータイプチャレンジの全国大会結果一覧。298件のイベント・1190デッキのデータを掲載。各イベントの優勝・入賞デッキが確認できます。">
  <meta property="og:type" content="website">

  <meta name="twitter:title" content="イベント一覧 | GCG STATS">
  <meta name="twitter:description" content="ガンダムカードゲーム ニュータイプチャレンジの全国大会結果一覧。298件のイベントデータを掲載。">
  <meta name="twitter:image" content="https://gcg-stats.com/images/ogp-default.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">

</head>
<body>
  <div id="header"></div>

  <main class="container">
    <nav id="breadcrumb-container" aria-label="パンくずリスト"></nav>

    <div class="section-header">
      <h1 class="section-title">イベント一覧</h1>
      <span class="section-badge" id="event-count">--</span>
    </div>
    <div id="share-buttons"></div>

    <div id="series-selector-area" class="series-selector" aria-label="シリーズ絞り込み"></div>
    <div id="date-filter-area" style="margin-bottom:12px"></div>
    <div class="filter-bar">
      <input type="text" class="filter-input" id="search-input" placeholder="店舗名・プレイヤー名で検索...">
    </div>

    <div class="event-list" id="events-list">
      <div class="loading">データを読み込み中</div>
    </div>

    <div class="pagination" id="pagination"></div>
    <noscript><h2>イベント一覧（全298件）</h2><p>JavaScript を有効にすると、シリーズ絞り込み・期間フィルター・検索機能を利用できます。最新の大会結果は個別ページ（/events/{id}.html）でも閲覧できます。</p></noscript>
  </main>

  <div id="footer"></div>

  <script src="shared/ntc-rank-consolidator.js?v=1"></script>
  <script src="js/common.js?v=13"></script>
  <script>
    GCG.init();

    const ITEMS_PER_PAGE = 30;
    let allEvents = [];
    let allSeries = {};
    let filteredEvents = [];
    let currentPage = 1;
    let currentSeriesId = ''; // '' = all

    async function init() {
      // breadcrumb
      var bcItems = [
        { name: 'トップ', href: GCG.getBasePath() },
        { name: 'イベント' }
      ];
      document.getElementById('breadcrumb-container').innerHTML = GCG.renderBreadcrumb(bcItems)
        + GCG.renderBreadcrumbJsonLd(bcItems, 'https://gcg-stats.com/');

      const basePath = GCG.getBasePath();
      const [eventsData, seriesMapRes] = await Promise.all([
        GCG.loadEvents(),
        fetch(basePath + 'data/series.json').then(r => r.ok ? r.json() : {}).catch(() => ({}))
      ]);
      allEvents = GCG.sortedEvents(eventsData.events);
      allSeries = seriesMapRes || {};

      // URL param で series 指定があれば読み取る
      var urlParams = new URLSearchParams(window.location.search);
      var paramSeries = urlParams.get('series_id') || urlParams.get('series');
      if (paramSeries && allSeries[paramSeries]) {
        currentSeriesId = paramSeries;
      } else {
        currentSeriesId = pickDefaultSeries();
      }

      renderSeriesSelector();

      // 日付フィルター設置（シリーズ連動: 選択シリーズの start_date/end_date を初期値に）
      var initialRange = getSeriesRangeById(currentSeriesId);
      const filterArea = document.getElementById('date-filter-area');
      filterArea.innerHTML = GCG.renderDateFilterHTML(initialRange.start, initialRange.end);
      document.getElementById('date-start').addEventListener('change', applyFilters);
      document.getElementById('date-end').addEventListener('change', applyFilters);
      document.getElementById('date-reset-btn').addEventListener('click', function() {
        document.getElementById('date-start').value = '';
        document.getElementById('date-end').value = '';
        applyFilters();
      });

      applyFilters();
    }

    // シリーズIDから {start, end} を返す。'' (全シリーズ) の場合は全期間を意味する空文字。
    function getSeriesRangeById(sid) {
      if (!sid) return { start: '', end: '' };
      var s = allSeries[sid];
      return GCG.getSeriesDateRange ? GCG.getSeriesDateRange(s) : { start: s ? s.start_date || '' : '', end: s ? s.end_date || '' : '' };
    }

    function pickDefaultSeries() {
      // active → upcoming → 最新completed → '' (全体)
      var list = Object.values(allSeries || {});
      if (!list.length) return '';
      var active = list.filter(function(s){return s.status === 'active';});
      if (active.length) return active.sort(function(a,b){return (a.start_date||'').localeCompare(b.start_date||'');})[0].id;
      var upcoming = list.filter(function(s){return s.status === 'upcoming';})
        .sort(function(a,b){return (a.start_date||'').localeCompare(b.start_date||'');});
      if (upcoming.length) return upcoming[0].id;
      var completed = list.filter(function(s){return s.status === 'completed';})
        .sort(function(a,b){return (b.start_date||'').localeCompare(a.start_date||'');});
      if (completed.length) return completed[0].id;
      return '';
    }

    function renderSeriesSelector() {
      var el = document.getElementById('series-selector-area');
      if (!el) return;
      var list = Object.values(allSeries || {})
        .sort(function(a,b){return (b.start_date||'').localeCompare(a.start_date||'');});
      if (!list.length) { el.innerHTML = ''; return; }
      var tabs = [];
      tabs.push(
        '<button type="button" class="series-tab' + (currentSeriesId === '' ? ' is-active' : '') + '" data-sid="">全シリーズ</button>'
      );
      list.forEach(function(s){
        var isActive = currentSeriesId === s.id;
        var label = GCG.escapeHtml(s.short_name || s.display_name || s.id);
        tabs.push(
          '<button type="button" class="series-tab' + (isActive ? ' is-active' : '') + '" data-sid="' + GCG.escapeHtml(s.id) + '">' + label + '</button>'
        );
      });
      el.innerHTML = tabs.join('');
      el.querySelectorAll('.series-tab').forEach(function(btn){
        btn.addEventListener('click', function(){
          currentSeriesId = btn.getAttribute('data-sid') || '';
          el.querySelectorAll('.series-tab').forEach(function(b){ b.classList.remove('is-active'); });
          btn.classList.add('is-active');
          // シリーズ切替時: 期間を新シリーズの start_date/end_date に自動更新
          var r = getSeriesRangeById(currentSeriesId);
          var dsEl = document.getElementById('date-start');
          var deEl = document.getElementById('date-end');
          if (dsEl) dsEl.value = r.start || '';
          if (deEl) deEl.value = r.end || '';
          applyFilters();
          // URL を更新（履歴汚さない replaceState）
          var u = new URL(window.location.href);
          if (currentSeriesId) u.searchParams.set('series_id', currentSeriesId);
          else u.searchParams.delete('series_id');
          window.history.replaceState({}, '', u.toString());
        });
      });
    }

    function applyFilters() {
      const searchText = document.getElementById('search-input').value.toLowerCase();
      const dateStart = document.getElementById('date-start').value;
      const dateEnd = document.getElementById('date-end').value;

      filteredEvents = GCG.filterEventsByDate(allEvents, dateStart, dateEnd).filter(ev => {
        if (currentSeriesId && String(ev.series_id || '') !== currentSeriesId) return false;
        if (searchText) {
          const haystack = [
            ev.store,
            ...(ev.results || []).filter(r => r.rank <= 4).map(r => r.player)
          ].join(' ').toLowerCase();
          if (!haystack.includes(searchText)) return false;
        }
        return true;
      });

      currentPage = 1;
      render();
    }

    async function render() {
      document.getElementById('event-count').textContent = filteredEvents.length + '件';

      const start = (currentPage - 1) * ITEMS_PER_PAGE;
      const pageEvents = filteredEvents.slice(start, start + ITEMS_PER_PAGE);

      // series データを事前ロード(NTC順位集計の type ベース判定に使用)
      await GCG.loadSeries();

      const container = document.getElementById('events-list');
      container.innerHTML = pageEvents.map(evRaw => {
        // 64名NTC大会のみ「ベスト8(各順位2名)」表記に変換(指示書 NTC順位集計統合, 軽量モード)
        const ev = GCG.consolidateNtcRank(evRaw);
        const top4 = (ev.top4_colors || []).sort((a, b) => a.rank - b.rank);
        const top4Html = top4.map((t, i) => {
          const rankLabel = t.rank === 1 ? '優勝' : t.rank === 2 ? '準優勝' : t.rank + '位';
          const sep = i > 0 ? '<span style="color:var(--border);margin:0 2px">|</span>' : '';
          return sep + '<span style="display:inline-flex;align-items:center;gap:2px;font-size:11px">'
            + '<span style="color:var(--text-muted);font-family:var(--font-mono);min-width:32px">' + rankLabel + '</span>'
            + GCG.renderColorDots(t.colors)
            + '</span>';
        }).join('');
        var seriesMeta = ev.series_id && allSeries[ev.series_id] ? allSeries[ev.series_id] : null;
        var seriesBadgeHtml = seriesMeta && GCG.renderSeriesBadge ? GCG.renderSeriesBadge(seriesMeta.short_name || seriesMeta.display_name, seriesMeta.slug) : '';
        return ''
          + '<a href="events/' + ev.event_id + '.html" class="event-card">'
          +   '<span class="event-date">' + GCG.formatDate(ev.date) + '</span>'
          +   '<span class="event-store">' + GCG.escapeHtml(ev.store) + '</span>'
          +   (seriesBadgeHtml ? '<span class="event-card-series">' + seriesBadgeHtml + '</span>' : '')
          +   '<span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
          +     (top4Html || '<span style="color:var(--text-muted);font-size:11px">データなし</span>')
          +   '</span>'
          + '</a>';
      }).join('');

      if (pageEvents.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:48px;color:var(--text-muted);font-size:13px">該当するイベントがありません</div>';
      }

      // ページネーション
      const totalPages = Math.ceil(filteredEvents.length / ITEMS_PER_PAGE);
      const pag = document.getElementById('pagination');
      if (totalPages <= 1) { pag.innerHTML = ''; return; }
      let html = '';
      if (currentPage > 1) html += '<button onclick="goPage(' + (currentPage - 1) + ')">←</button>';
      for (let i = 1; i <= totalPages; i++) {
        if (totalPages > 10 && Math.abs(i - currentPage) > 2 && i > 2 && i < totalPages - 1) {
          if (i === currentPage - 3 || i === currentPage + 3) html += '<button disabled>...</button>';
          continue;
        }
        html += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
      }
      if (currentPage < totalPages) html += '<button onclick="goPage(' + (currentPage + 1) + ')">→</button>';
      pag.innerHTML = html;
    }

    function goPage(p) {
      currentPage = p;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('search-input').addEventListener('input', applyFilters);

    document.getElementById('header').innerHTML = GCG.renderHeader('events');
    document.getElementById('footer').innerHTML = GCG.renderFooter();

    init();
    GCG.renderShareButtons('share-buttons', 'イベント一覧 | GCG STATS');
  </script>
</body>
</html>
