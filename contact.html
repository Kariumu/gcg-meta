<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3MY17P4E7F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3MY17P4E7F');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ - GCG STATS</title>
  <!-- OGP -->
  <meta property="og:site_name" content="GCG STATS">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="お問い合わせ | GCG STATS">
  <meta property="og:description" content="GCG STATSへのお問い合わせページ。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://gcg-stats.com/contact.html">
  <meta property="og:image" content="https://gcg-stats.com/images/ogp-default.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://gcg-stats.com/images/ogp-default.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .contact-content { max-width: 640px; margin: 0 auto; }
    .contact-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 32px; margin-top: 24px;
    }
    .contact-card p {
      font-size: 13px; color: var(--text-secondary); line-height: 1.9; margin-bottom: 16px;
    }
    .contact-card p:last-child { margin-bottom: 0; }
    .contact-email {
      display: inline-block; background: var(--bg-elevated); border: 1px solid var(--border);
      padding: 12px 24px; border-radius: var(--radius); margin-top: 8px;
      font-family: var(--font-mono); font-size: 14px; font-weight: 600;
      color: var(--accent); letter-spacing: 0.5px; user-select: all;
    }
  </style>
</head>
<body>
  <div id="header"></div>

  <main class="container">
    <div class="section-header">
      <h1 class="section-title">お問い合わせ</h1>
    </div>

    <div class="contact-content">
      <div class="contact-card">
        <p>GCG STATSに関するお問い合わせは、下記メールアドレスにて受け付けております。</p>
        <p>掲載内容に問題がある場合（誤った情報の掲載、削除依頼など）も、お気軽にご連絡ください。可能な限り迅速に対応いたします。</p>

        <div class="contact-email">gcgstats.info [at] gmail.com</div>

        <p style="margin-top: 20px; font-size: 11px; color: var(--text-muted)">※ [at] を @ に置き換えてお送りください。</p>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/common.js?v=4"></script>
  <script>
    GCG.init();
    document.getElementById('header').innerHTML = GCG.renderHeader('');
    document.getElementById('footer').innerHTML = GCG.renderFooter();
  </script>
</body>
</html>
