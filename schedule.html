<body>
  <div id="header"></div>

  <main style="max-width:1000px;margin:0 auto;padding:20px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">
      <h1 style="margin:0;font-size:28px;font-weight:700">イベントスケジュール</h1>
    </div>
    <div id="last-updated" style="font-size:12px;color:var(--text-muted);margin-bottom:24px;font-family:var(--font-mono)"></div>

    <div id="loading" style="text-align:center;padding:40px;color:var(--text-muted)">イベント情報を読み込み中...</div>
    <div id="series-list"></div>
  </main>

  <div id="footer"></div>

  <script src="js/common.js?v=7"></script>
  <script>
    // Status determination (from pre-fetched JSON data)
    function getEventSeriesStatus(series) {
      var now = new Date();
      var applyEnd = new Date(series.apply_end_datetime);
      var firstStart = new Date(series.first_start_datetime);
      var lastStart = new Date(series.last_start_datetime);

      if (now < applyEnd) return { status: 'accepting', label: '応募受付中', color: '#22c55e' };
      if (now >= firstStart && now <= lastStart) return { status: 'ongoing', label: '開催中', color: '#f97316' };
      if (now < firstStart) return { status: 'upcoming', label: '開催予定', color: '#3b82f6' };
      return { status: 'ended', label: '終了', color: '#6b7280' };
    }

    function formatDeadline(dateStr) {
      var d = new Date(dateStr);
      return (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }

    // Card rendering
    function renderSeriesCard(series) {
      var card = document.createElement('a');
      card.href = 'schedule-detail.html?series_id=' + series.event_series_id;
      card.style.cssText = 'display:block;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;text-decoration:none;transition:border-color 0.15s';
      card.onmouseover = function() { card.style.borderColor = 'var(--accent)'; };
      card.onmouseout = function() { card.style.borderColor = 'var(--border)'; };

      var badge = '<span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;color:#fff;background:' + series.status.color + ';font-family:var(--font-mono)">' + series.status.label + '</span>';
      var deadline = (series.status.status === 'accepting')
        ? '<div style="font-size:12px;color:var(--text-muted);margin-top:4px;font-family:var(--font-mono)">応募締切: ' + formatDeadline(series.apply_end_datetime) + '</div>'
        : '';

      card.innerHTML =
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">' + badge + '</div>' +
        '<div style="font-size:15px;font-weight:600;color:var(--text-primary)">' + series.event_series_title + '</div>' +
        deadline +
        '<div style="font-size:12px;color:var(--text-muted);margin-top:4px;font-family:var(--font-mono)">開催数: ' + series.total + '件</div>';
      return card;
    }

    // Init
    async function init() {
      GCG.init();
      document.getElementById('header').innerHTML = GCG.renderHeader('schedule');
      document.getElementById('footer').innerHTML = GCG.renderFooter();

      try {
        var res = await fetch('data/schedule.json');
        var scheduleData = await res.json();

        // 最終更新日時を表示
        if (scheduleData.last_updated) {
          var upd = new Date(scheduleData.last_updated);
          document.getElementById('last-updated').textContent = '最終更新: ' + upd.getFullYear() + '/' + (upd.getMonth()+1) + '/' + upd.getDate() + ' ' + String(upd.getHours()).padStart(2,'0') + ':' + String(upd.getMinutes()).padStart(2,'0');
        }

        var series = scheduleData.series
          .map(function(s) { s.status = getEventSeriesStatus(s); return s; })
          .filter(function(s) { return s.status.status !== 'ended'; })
          .sort(function(a, b) {
            var order = { accepting: 0, ongoing: 1, upcoming: 2 };
            return (order[a.status.status] || 9) - (order[b.status.status] || 9);
          });

        document.getElementById('loading').style.display = 'none';
        var list = document.getElementById('series-list');
        if (series.length === 0) {
          list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted)">現在予定されているイベントはありません</div>';
        } else {
          series.forEach(function(s) { list.appendChild(renderSeriesCard(s)); });
        }
      } catch(e) {
        document.getElementById('loading').textContent = 'イベント情報の読み込みに失敗しました: ' + e.message;
        document.getElementById('loading').style.color = '#ff5050';
      }
    }

    init();
  </script>
</body>
</html>
