<body>
  <div id="header"></div>

  <main style="max-width:1000px;margin:0 auto;padding:20px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
      <h1 style="margin:0;font-size:28px;font-weight:700">イベントスケジュール</h1>
      <span style="display:inline-block;padding:4px 10px;border-radius:4px;font-size:12px;font-weight:600;color:#fff;background:#ef4444;font-family:var(--font-mono)">LIVE</span>
    </div>

    <div id="loading" style="text-align:center;padding:40px;color:var(--text-muted)">イベント情報を取得中...</div>
    <div id="series-list"></div>
  </main>

  <div id="footer"></div>

  <script src="js/common.js?v=8"></script>
  <script>
    // Status determination
    function getEventSeriesStatus(events) {
      var now = new Date();
      var applyEndDates = events.map(function(e) { return new Date(e.apply_end_datetime); });
      var startDates = events.map(function(e) { return new Date(e.start_datetime); });
      var latestApplyEnd = new Date(Math.max.apply(null, applyEndDates));
      var earliestStart = new Date(Math.min.apply(null, startDates));
      var latestStart = new Date(Math.max.apply(null, startDates));

      if (now < latestApplyEnd) return { status: 'accepting', label: '応募受付中', color: '#22c55e' };
      if (now >= earliestStart && now <= latestStart) return { status: 'ongoing', label: '開催中', color: '#f97316' };
      if (now < earliestStart) return { status: 'upcoming', label: '開催予定', color: '#3b82f6' };
      return { status: 'ended', label: '終了', color: '#6b7280' };
    }

    function formatDeadline(dateStr) {
      var d = new Date(dateStr);
      return (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }

    // Card rendering
    function renderSeriesCard(series) {
      var card = document.createElement('a');
      card.href = 'schedule-detail.html?series_id=' + series.event_series_id;
      card.style.cssText = 'display:block;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;text-decoration:none;transition:border-color 0.15s';
      card.onmouseover = function() { card.style.borderColor = 'var(--accent)'; };
      card.onmouseout = function() { card.style.borderColor = 'var(--border)'; };

      var badge = '<span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;color:#fff;background:' + series.status.color + ';font-family:var(--font-mono)">' + series.status.label + '</span>';
      var deadline = (series.status.status === 'accepting')
        ? '<div style="font-size:12px;color:var(--text-muted);margin-top:4px;font-family:var(--font-mono)">応募締切: ' + formatDeadline(series.apply_end_datetime) + '</div>'
        : '';

      card.innerHTML =
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">' + badge + '</div>' +
        '<div style="font-size:15px;font-weight:600;color:var(--text-primary)">' + series.event_series_title + '</div>' +
        deadline +
        '<div style="font-size:12px;color:var(--text-muted);margin-top:4px;font-family:var(--font-mono)">開催数: ' + series.total + '件</div>';
      return card;
    }

    // Data loading
    async function loadEventSeries() {
      var res = await fetch('https://api.bandai-tcg-plus.com/api/user/event/list/params');
      var data = await res.json();
      var allSeries = data.success.event_series_with_game_title_id;

      var jpSeries = allSeries.filter(function(s) {
        return s.game_title_id === 15 &&
          s.event_series_title.indexOf('[') === -1 &&
          s.event_series_title.indexOf('Championships26-27 Store') === -1;
      });

      for (var i = 0; i < jpSeries.length; i++) {
        var series = jpSeries[i];
        try {
          var evRes = await fetch('https://api.bandai-tcg-plus.com/api/user/event/list?game_title_id=15&event_series_id=' + series.event_series_id + '&limit=1&offset=0');
          var evData = await evRes.json();
          var events = evData.success.event_list;
          var total = evData.success.total;
          if (events.length === 0) continue;
          series.total = total;
          series.apply_end_datetime = events[0].apply_end_datetime;
          series.status = getEventSeriesStatus(events);
        } catch(e) { /* skip */ }
      }

      return jpSeries
        .filter(function(s) { return s.status && s.status.status !== 'ended'; })
        .sort(function(a, b) {
          var order = { accepting: 0, ongoing: 1, upcoming: 2 };
          return (order[a.status.status] || 9) - (order[b.status.status] || 9);
        });
    }

    // Init
    async function init() {
      GCG.init();
      document.getElementById('header').innerHTML = GCG.renderHeader('schedule');
      document.getElementById('footer').innerHTML = GCG.renderFooter();

      try {
        var series = await loadEventSeries();
        document.getElementById('loading').style.display = 'none';
        var list = document.getElementById('series-list');
        if (series.length === 0) {
          list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted)">現在予定されているイベントはありません</div>';
        } else {
          series.forEach(function(s) { list.appendChild(renderSeriesCard(s)); });
        }
      } catch(e) {
        document.getElementById('loading').textContent = 'イベント情報の取得に失敗しました: ' + e.message;
        document.getElementById('loading').style.color = '#ff5050';
      }
    }

    init();
  </script>
</body>
</html>
