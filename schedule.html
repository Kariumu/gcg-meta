<body>
  <div id="header"></div>

  <main style="max-width:1000px;margin:0 auto;padding:20px">
    <div style="margin-bottom:24px">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <h1 style="margin:0;font-size:28px;font-weight:700">イベントスケジュール</h1>
        <span style="display:inline-block;padding:4px 10px;border-radius:4px;font-size:12px;font-weight:600;color:#fff;background:#3b82f6;font-family:var(--font-mono)">毎日更新</span>
      </div>
      <div id="last-updated" style="margin-top:6px;font-size:12px;color:var(--text-muted);font-family:var(--font-mono)"></div>
    </div>

    <div id="loading" style="text-align:center;padding:40px;color:var(--text-muted)">イベント情報を取得中...</div>
    <div id="series-list"></div>
  </main>

  <div id="footer"></div>

  <script src="js/common.js?v=10"></script>
  <script>
    // Status determination — 全イベントの最遅申込期限・最早/最遅開始時刻から判定
    // data/schedule.json では apply_end_datetime / start_datetime が null のイベントが含まれるため、
    // 有効な日時のみを対象にする
    function getEventSeriesStatus(events) {
      var now = new Date();
      function toValidDate(s) {
        if (!s) return null;
        var d = new Date(s);
        return isNaN(d.getTime()) ? null : d;
      }
      var applyEndDates = events.map(function(e) { return toValidDate(e.apply_end_datetime); }).filter(Boolean);
      var startDates    = events.map(function(e) { return toValidDate(e.start_datetime); }).filter(Boolean);

      // 日時が一件も取れない series は 'ended' 扱い（後続でフィルタ除外）
      if (applyEndDates.length === 0 && startDates.length === 0) {
        return { status: 'ended', label: '終了', color: '#6b7280' };
      }
      var latestApplyEnd = applyEndDates.length ? new Date(Math.max.apply(null, applyEndDates)) : null;
      var earliestStart  = startDates.length ? new Date(Math.min.apply(null, startDates)) : null;
      var latestStart    = startDates.length ? new Date(Math.max.apply(null, startDates)) : null;

      if (latestApplyEnd && now < latestApplyEnd) return { status: 'accepting', label: '応募受付中', color: '#22c55e' };
      if (earliestStart && latestStart && now >= earliestStart && now <= latestStart) return { status: 'ongoing', label: '開催中', color: '#f97316' };
      if (earliestStart && now < earliestStart) return { status: 'upcoming', label: '開催予定', color: '#3b82f6' };
      return { status: 'ended', label: '終了', color: '#6b7280' };
    }

    function formatDeadline(dateStr) {
      var d = new Date(dateStr);
      return (d.getMonth()+1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    }

    function formatLastUpdated(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      var y = d.getFullYear();
      var m = String(d.getMonth()+1).padStart(2,'0');
      var day = String(d.getDate()).padStart(2,'0');
      var hh = String(d.getHours()).padStart(2,'0');
      var mm = String(d.getMinutes()).padStart(2,'0');
      return y + '/' + m + '/' + day + ' ' + hh + ':' + mm;
    }

    // Card rendering
    function renderSeriesCard(series) {
      var card = document.createElement('a');
      card.href = 'schedule-detail.html?series_id=' + series.event_series_id;
      card.style.cssText = 'display:block;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px;text-decoration:none;transition:border-color 0.15s';
      card.onmouseover = function() { card.style.borderColor = 'var(--accent)'; };
      card.onmouseout = function() { card.style.borderColor = 'var(--border)'; };

      var badge = '<span style="display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;color:#fff;background:' + series.status.color + ';font-family:var(--font-mono)">' + series.status.label + '</span>';
      var deadline = (series.status.status === 'accepting')
        ? '<div style="font-size:12px;color:var(--text-muted);margin-top:4px;font-family:var(--font-mono)">応募締切: ' + formatDeadline(series.apply_end_datetime) + '</div>'
        : '';

      card.innerHTML =
        '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">' + badge + '</div>' +
        '<div style="font-size:15px;font-weight:600;color:var(--text-primary)">' + series.event_series_title + '</div>' +
        deadline +
        '<div style="font-size:12px;color:var(--text-muted);margin-top:4px;font-family:var(--font-mono)">開催数: ' + series.total + '件</div>';
      return card;
    }

    // Data loading — サイト側で事前取得済み（毎日14:00 JST更新）の data/schedule.json を参照
    async function loadEventSeries() {
      var res = await fetch(GCG.DATA_PATH + 'schedule.json');
      if (!res.ok) throw new Error('schedule.json fetch failed: ' + res.status);
      var data = await res.json();
      var lastUpdated = data.last_updated;

      // data/schedule.json の series は fetch-schedule.js 側で既に JP のみに絞り込み済み
      var series = (data.series || []).map(function(s) { return Object.assign({}, s); });
      var eventsByseries = data.events || {};

      for (var i = 0; i < series.length; i++) {
        var sid = String(series[i].event_series_id);
        var events = eventsByseries[sid] || [];
        if (events.length === 0) { series[i]._skip = true; continue; }
        series[i].status = getEventSeriesStatus(events);
        // 表示用の応募締切は「最遅」を採用（series.apply_end_datetime は先頭イベントの値のため上書き）
        // 無効な日時 / null はスキップ、すべて無効なら元の値を維持
        var applyEnds = events.map(function(e) {
          if (!e.apply_end_datetime) return null;
          var d = new Date(e.apply_end_datetime);
          return isNaN(d.getTime()) ? null : d;
        }).filter(Boolean);
        if (applyEnds.length > 0) {
          var latestApplyEnd = new Date(Math.max.apply(null, applyEnds));
          series[i].apply_end_datetime = latestApplyEnd.toISOString();
        }
      }

      return {
        lastUpdated: lastUpdated,
        series: series
          .filter(function(s) { return !s._skip && s.status && s.status.status !== 'ended'; })
          .sort(function(a, b) {
            var order = { accepting: 0, ongoing: 1, upcoming: 2 };
            return (order[a.status.status] || 9) - (order[b.status.status] || 9);
          })
      };
    }

    // Init
    async function init() {
      GCG.init();
      document.getElementById('header').innerHTML = GCG.renderHeader('schedule');
      document.getElementById('footer').innerHTML = GCG.renderFooter();

      try {
        var result = await loadEventSeries();
        document.getElementById('loading').style.display = 'none';
        // 最終更新の表示
        var meta = document.getElementById('last-updated');
        if (meta) {
          meta.textContent = '最終更新: ' + formatLastUpdated(result.lastUpdated);
        }
        var list = document.getElementById('series-list');
        if (result.series.length === 0) {
          list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted)">現在予定されているイベントはありません</div>';
        } else {
          result.series.forEach(function(s) { list.appendChild(renderSeriesCard(s)); });
        }
      } catch(e) {
        document.getElementById('loading').textContent = 'イベント情報の取得に失敗しました: ' + e.message;
        document.getElementById('loading').style.color = '#ff5050';
      }
    }

    init();
  </script>
</body>
