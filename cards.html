<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3MY17P4E7F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3MY17P4E7F');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カード情報 - GCG STATS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <div id="header"></div>

  <main class="container">
    <div id="card-content">
      <div class="loading">データを読み込み中</div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/common.js?v=3"></script>
  <script>
    GCG.init();

    async function renderCard() {
      const cardId = GCG.getParam('id');
      if (!cardId) {
        document.getElementById('card-content').innerHTML = '<p>カードIDが指定されていません。</p>';
        return;
      }

      const [eventsData, summary] = await Promise.all([
        GCG.loadEvents(),
        GCG.loadSummary()
      ]);

      document.title = `${cardId} - GCG STATS`;

      // このカードが各デッキタイプでどう使われているか
      const deckTypes = summary.deck_type_ranking || [];
      const typeUsage = [];
      for (const dt of deckTypes) {
        const card = (dt.card_ranking || []).find(c => c.card_id === cardId);
        if (card) {
          typeUsage.push({
            label: dt.label,
            colors: dt.colors,
            deckCount: dt.count,
            adoptionCount: card.decks,
            usageRate: card.usage_rate,
            avgCount: card.avg_count
          });
        }
      }

      // このカードを使っているTOP4の実績
      const adoptions = [];
      for (const ev of Object.values(eventsData.events)) {
        for (const result of (ev.results || [])) {
          if (result.rank > 4) continue;
          const card = (result.deck || []).find(c => c.card_id === cardId);
          if (card) {
            adoptions.push({
              event: ev,
              player: result.player,
              rank: result.rank,
              count: card.count
            });
          }
        }
      }
      adoptions.sort((a, b) => (b.event.date || '').localeCompare(a.event.date || ''));

      // 全体stats
      const globalCard = (summary.card_ranking || []).find(c => c.card_id === cardId);

      let html = `
        <div style="margin-bottom:12px">
          <a href="meta.html" style="color:var(--text-muted);text-decoration:none;font-size:13px;transition:color 0.15s"
             onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-muted)'">
            ← 環境分析に戻る
          </a>
        </div>

        <div style="display:flex;gap:24px;margin-bottom:32px;flex-wrap:wrap">
          <div style="flex-shrink:0">
            <img src="${GCG.cardImageUrl(cardId)}" alt="${cardId}"
                 style="width:180px;border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-md)"
                 onerror="this.style.display='none'">
          </div>
          <div style="flex:1;min-width:300px">
            <h1 style="font-family:var(--font-mono);font-size:22px;margin-bottom:8px">${GCG.escapeHtml(cardId)}</h1>
            <a href="${GCG.cardSearchUrl(cardId)}" target="_blank" rel="noopener"
               style="color:var(--blue);font-size:13px;text-decoration:none">
              公式カード情報を見る →
            </a>

            ${globalCard ? `
              <div class="stats-grid" style="margin-top:16px">
                <div class="stat-card">
                  <div class="stat-label">TOP4 採用数</div>
                  <div class="stat-value">${globalCard.decks}<span class="unit"> / ${summary.total_decks}</span></div>
                </div>
                <div class="stat-card">
                  <div class="stat-label">TOP4 採用率</div>
                  <div class="stat-value">${globalCard.usage_rate}<span class="unit">%</span></div>
                </div>
                <div class="stat-card">
                  <div class="stat-label">優勝デッキ数</div>
                  <div class="stat-value">${globalCard.wins}</div>
                </div>
                <div class="stat-card">
                  <div class="stat-label">平均採用枚数</div>
                  <div class="stat-value">${globalCard.avg_count}<span class="unit">枚</span></div>
                </div>
              </div>
            ` : '<p style="margin-top:16px;color:var(--text-muted)">TOP4での採用実績がありません</p>'}
          </div>
        </div>

        ${typeUsage.length > 0 ? `
          <section class="mb-32">
            <div class="section-header">
              <h2 class="section-title">デッキタイプ別採用状況</h2>
            </div>
            <table class="data-table">
              <thead>
                <tr>
                  <th>デッキタイプ</th>
                  <th style="width:90px">採用数</th>
                  <th style="width:180px">採用率</th>
                  <th style="width:60px">平均枚数</th>
                </tr>
              </thead>
              <tbody>
                ${typeUsage.map(tu => `
                  <tr>
                    <td>${GCG.renderColorTags(tu.colors)}</td>
                    <td class="text-mono">${tu.adoptionCount} / ${tu.deckCount}</td>
                    <td>
                      <div class="flex items-center gap-8">
                        <div class="usage-bar-container">
                          <div class="usage-bar" style="width:${tu.usageRate}%;background:${GCG.primaryColorHex(tu.colors)}"></div>
                        </div>
                        <span class="usage-rate">${tu.usageRate}%</span>
                      </div>
                    </td>
                    <td class="text-mono">${tu.avgCount}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </section>
        ` : ''}

        <section>
          <div class="section-header">
            <h2 class="section-title">TOP4 採用実績</h2>
            <span class="section-badge">${adoptions.length}件</span>
          </div>

          ${adoptions.length > 0 ? `
            <table class="data-table">
              <thead>
                <tr>
                  <th>日付</th>
                  <th>店舗</th>
                  <th>プレイヤー</th>
                  <th style="width:60px">順位</th>
                  <th style="width:60px">枚数</th>
                </tr>
              </thead>
              <tbody>
                ${adoptions.slice(0, 100).map(a => `
                  <tr>
                    <td class="text-mono" style="color:var(--accent)">${GCG.formatDate(a.event.date)}</td>
                    <td><a href="event.html?id=${a.event.event_id}" style="color:var(--text-primary);text-decoration:none">${GCG.escapeHtml(a.event.store)}</a></td>
                    <td>${GCG.escapeHtml(a.player)}</td>
                    <td class="rank-cell ${GCG.rankClass(a.rank)}">${GCG.rankText(a.rank)}</td>
                    <td class="text-mono">×${a.count}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
            ${adoptions.length > 100 ? '<p style="text-align:center;margin-top:16px;color:var(--text-muted);font-size:13px">最新100件を表示</p>' : ''}
          ` : '<div style="text-align:center;padding:32px;color:var(--text-muted)">TOP4での採用実績がありません</div>'}
        </section>
      `;

      document.getElementById('card-content').innerHTML = html;
    }

    document.getElementById('header').innerHTML = GCG.renderHeader('');
    document.getElementById('footer').innerHTML = GCG.renderFooter();

    renderCard();
  </script>
</body>
</html>
