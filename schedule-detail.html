<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント開催一覧 | GCG STATS</title>
  <meta name="description" content="ガンダムカードゲームのイベント開催一覧。地域でフィルタして近くのイベントを検索できます。">

  <meta property="og:description" content="ガンダムカードゲームのイベント開催一覧。地域でフィルタして近くのイベントを検索できます。">
  <meta property="og:image" content="https://gcg-stats.com/og-image.png">
  <meta property="og:url" content="https://gcg-stats.com/schedule-detail.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="イベント開催一覧 | GCG STATS">
  <meta name="twitter:description" content="ガンダムカードゲームのイベント開催一覧。地域でフィルタして近くのイベントを検索できます。">
  <meta name="twitter:image" content="https://gcg-stats.com/og-image.png">
  <link rel="canonical" href="https://gcg-stats.com/schedule-detail.html">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3MY17P4E7F');
  </script>
  <style>
    #event-list a:hover {
      text-decoration: underline;
    }
    .pref-filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 14px;
      font-size: 12px;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: all 0.15s;
      border-radius: 4px 0 0 4px;
      border-right: none;
    }
    .pref-filter-btn.no-expand {
      border-radius: var(--radius);
      border-right: 1px solid var(--border);
    }
    .pref-filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .pref-filter-btn.active {
      background: rgba(255, 170, 0, 0.1);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .pref-expand-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: all 0.15s;
      border-radius: 0 4px 4px 0;
      min-width: 28px;
      padding: 6px 4px;
    }
    .pref-expand-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .pref-expand-btn.active {
      background: rgba(255, 170, 0, 0.1);
      border-color: var(--accent);
      color: var(--accent);
    }
    .city-filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 4px 10px;
      border-radius: var(--radius);
      font-size: 11px;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: all 0.15s;
    }
    .city-filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .city-filter-btn.active {
      background: rgba(255, 170, 0, 0.1);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="header"></div>

  <main style="max-width:1000px;margin:0 auto;padding:20px">
    <div style="margin-bottom:20px">
      <a href="schedule.html" style="color:var(--accent);text-decoration:none;font-size:14px">← スケジュールに戻る</a>
    </div>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
      <h1 id="page-title" style="margin:0;font-size:28px;font-weight:700">イベント開催一覧</h1>
      <span id="event-count-badge" style="display:inline-block;padding:4px 10px;border-radius:4px;font-size:12px;font-weight:600;color:#fff;background:#ef4444;font-family:var(--font-mono)">0件</span>
    </div>

    <div id="region-filter" style="margin-bottom:24px"></div>

    <div id="filtered-count" style="margin-bottom:16px;font-size:14px;color:var(--text-muted)"></div>

    <div id="loading" style="text-align:center;padding:40px;color:var(--text-muted)">イベント情報を取得中...</div>
    <div id="event-list"></div>
  </main>

  <div id="footer"></div>

  <script src="js/common.js?v=7"></script>
  <script>
    // Regions data with JP codes
    var REGIONS = [
      {
        name: '北海道',
        prefs: [
          { code: 'JP-01', name: '北海道' }
        ]
      },
      {
        name: '東北',
        prefs: [
          { code: 'JP-02', name: '青森県' },
          { code: 'JP-03', name: '岩手県' },
          { code: 'JP-04', name: '宮城県' },
          { code: 'JP-05', name: '秋田県' },
          { code: 'JP-06', name: '山形県' },
          { code: 'JP-07', name: '福島県' }
        ]
      },
      {
        name: '関東',
        prefs: [
          { code: 'JP-08', name: '茨城県' },
          { code: 'JP-09', name: '栃木県' },
          { code: 'JP-10', name: '群馬県' },
          { code: 'JP-11', name: '埼玉県' },
          { code: 'JP-12', name: '千葉県' },
          { code: 'JP-13', name: '東京都' },
          { code: 'JP-14', name: '神奈川県' }
        ]
      },
      {
        name: '中部',
        prefs: [
          { code: 'JP-15', name: '新潟県' },
          { code: 'JP-16', name: '富山県' },
          { code: 'JP-17', name: '石川県' },
          { code: 'JP-18', name: '福井県' },
          { code: 'JP-19', name: '山梨県' },
          { code: 'JP-20', name: '長野県' },
          { code: 'JP-21', name: '岐阜県' },
          { code: 'JP-22', name: '愛知県' },
          { code: 'JP-23', name: '三重県' }
        ]
      },
      {
        name: '近畿',
        prefs: [
          { code: 'JP-24', name: '滋賀県' },
          { code: 'JP-25', name: '京都府' },
          { code: 'JP-26', name: '大阪府' },
          { code: 'JP-27', name: '兵庫県' },
          { code: 'JP-28', name: '奈良県' },
          { code: 'JP-29', name: '和歌山県' }
        ]
      },
      {
        name: '中国',
        prefs: [
          { code: 'JP-30', name: '鳥取県' },
          { code: 'JP-31', name: '島根県' },
          { code: 'JP-32', name: '岡山県' },
          { code: 'JP-33', name: '広島県' },
          { code: 'JP-34', name: '山口県' }
        ]
      },
      {
        name: '四国',
        prefs: [
          { code: 'JP-36', name: '徳島県' },
          { code: 'JP-37', name: '香川県' },
          { code: 'JP-38', name: '愛媛県' },
          { code: 'JP-39', name: '高知県' }
        ]
      },
      {
        name: '九州・沖縄',
        prefs: [
          { code: 'JP-40', name: '福岡県' },
          { code: 'JP-41', name: '佐賀県' },
          { code: 'JP-42', name: '長崎県' },
          { code: 'JP-43', name: '熊本県' },
          { code: 'JP-44', name: '大分県' },
          { code: 'JP-45', name: '宮崎県' },
          { code: 'JP-46', name: '鹿児島県' },
          { code: 'JP-47', name: '沖縄県' }
        ]
      }
    ];

    var HOLIDAYS_2026 = [
      '2026-01-01', '2026-01-12', '2026-02-11', '2026-02-23', '2026-03-20',
      '2026-04-29', '2026-05-03', '2026-05-04', '2026-05-05', '2026-05-06',
      '2026-07-20', '2026-08-11', '2026-09-21', '2026-09-22', '2026-09-23',
      '2026-10-12', '2026-11-03', '2026-11-23', '2026-12-23'
    ];

    // === フィルタ状態 ===
    // selectedPrefs: { 'JP-13': Set(['千代田区', '豊島区', ...]), ... }
    var selectedPrefs = {};
    var expandedPrefs = new Set();
    var allEvents = [];
    var allStores = {};
    var cityMap = {}; // { 'JP-13': { '千代田区': [event1, ...], ... }, ... }

    function normalizeCity(city) {
      if (!city) return '不明';
      city = city.replace(/^(北海道|東京都|.{2,3}[府県])/, '');
      var m = city.match(/^(.+?市.+?区)/);
      if (m) return m[1];
      m = city.match(/^(.+?[市区町村])/);
      if (m) return m[1];
      return city;
    }

    function buildCityMap() {
      cityMap = {};
      allEvents.forEach(function(e) {
        var store = allStores[e.organizer_id] || {};
        var pref = e.pref_code || '';
        var city = normalizeCity(store.city || e.city_code || '');
        if (!cityMap[pref]) cityMap[pref] = {};
        if (!cityMap[pref][city]) cityMap[pref][city] = [];
        cityMap[pref][city].push(e);
      });
    }

    function togglePref(prefCode) {
      if (selectedPrefs[prefCode]) {
        delete selectedPrefs[prefCode];
      } else {
        var cities = Object.keys(cityMap[prefCode] || {});
        selectedPrefs[prefCode] = new Set(cities);
      }
      renderFilteredEvents();
      updateButtonStates();
    }

    function toggleCity(prefCode, cityName) {
      if (!selectedPrefs[prefCode]) {
        selectedPrefs[prefCode] = new Set();
      }
      if (selectedPrefs[prefCode].has(cityName)) {
        selectedPrefs[prefCode].delete(cityName);
        if (selectedPrefs[prefCode].size === 0) {
          delete selectedPrefs[prefCode];
        }
      } else {
        selectedPrefs[prefCode].add(cityName);
      }
      renderFilteredEvents();
      updateButtonStates();
    }

    function toggleExpand(prefCode) {
      if (expandedPrefs.has(prefCode)) {
        expandedPrefs.delete(prefCode);
      } else {
        expandedPrefs.add(prefCode);
      }
      updateCityDisplay(prefCode);
    }

    function clearAll() {
      selectedPrefs = {};
      expandedPrefs.clear();
      renderFilteredEvents();
      updateButtonStates();
      // collapse all city containers
      document.querySelectorAll('[id^="city-container-"]').forEach(function(el) {
        el.style.display = 'none';
      });
      document.querySelectorAll('.pref-expand-btn').forEach(function(btn) {
        btn.textContent = '+';
      });
    }

    function getDateColor(dateStr) {
      var d = new Date(dateStr);
      var year = d.getFullYear();
      var month = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      var dateKey = year + '-' + month + '-' + day;

      if (HOLIDAYS_2026.indexOf(dateKey) !== -1) return '#ef4444';
      var dow = d.getDay();
      if (dow === 0) return '#ef4444';
      if (dow === 6) return '#3b82f6';
      return '#6b7280';
    }

    function getDayOfWeekStr(dateStr) {
      var d = new Date(dateStr);
      var days = ['日', '月', '火', '水', '木', '金', '土'];
      return days[d.getDay()];
    }

    function renderEventRow(event) {
      var store = allStores[event.organizer_id] || {};
      var d = new Date(event.start_datetime);
      var month = d.getMonth() + 1;
      var day = d.getDate();
      var dow = getDayOfWeekStr(event.start_datetime);
      var dateColor = getDateColor(event.start_datetime);
      var hours = String(d.getHours()).padStart(2, '0');
      var minutes = String(d.getMinutes()).padStart(2, '0');
      var address = ((store.city || '') + ' ' + (store.address || '')).trim();
      var tcgPlusUrl = 'https://www.bandai-tcg-plus.com/event/' + event.id;
      var row = document.createElement('div');
      row.style.cssText = 'padding:10px 16px;border-bottom:1px solid var(--border)';
      row.innerHTML =
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">' +
          '<div style="flex:1;min-width:0">' +
            '<div style="display:flex;align-items:center;gap:8px;margin-bottom:2px">' +
              '<span style="font-size:15px;font-weight:700;color:' + dateColor + ';font-family:var(--font-mono)">' + month + '/' + day + '(' + dow + ')</span>' +
              '<span style="font-size:14px;color:var(--text-muted);font-family:var(--font-mono)">開催時間 ' + hours + ':' + minutes + '</span>' +
            '</div>' +
            '<a href="store.html?id=' + event.organizer_id + '" style="display:block;font-size:15px;font-weight:600;color:var(--text-primary);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + (store.name || '未定') + '</a>' +
            '<div style="font-size:13px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + address + '</div>' +
            '<div style="font-size:13px;color:var(--text-muted);margin-top:1px;font-family:var(--font-mono)">定員' + (event.max_join_count || 0) + '名　参加費' + (event.entry_fee || 0) + '円</div>' +
          '</div>' +
          '<a href="' + tcgPlusUrl + '" target="_blank" rel="noopener" style="flex-shrink:0;padding:6px 10px;background:var(--accent);color:#fff;border-radius:4px;font-size:11px;font-weight:600;text-decoration:none;font-family:var(--font-mono);white-space:nowrap">詳細・応募</a>' +
        '</div>';
      return row;
    }

    function getEventCountByPref(prefCode) {
      var prefCities = cityMap[prefCode] || {};
      var count = 0;
      Object.keys(prefCities).forEach(function(city) {
        count += prefCities[city].length;
      });
      return count;
    }

    function renderRegionFilter() {
      var container = document.getElementById('region-filter');
      container.innerHTML = '';

      for (var i = 0; i < REGIONS.length; i++) {
        var region = REGIONS[i];
        var regionDiv = document.createElement('div');
        regionDiv.className = 'region-group';
        regionDiv.style.cssText = 'margin-bottom:16px';

        var regionTitle = document.createElement('div');
        regionTitle.className = 'region-title';
        regionTitle.style.cssText = 'font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px';
        regionTitle.textContent = region.name;
        regionDiv.appendChild(regionTitle);

        var prefContainer = document.createElement('div');
        prefContainer.className = 'pref-buttons';
        prefContainer.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px';

        for (var j = 0; j < region.prefs.length; j++) {
          var pref = region.prefs[j];
          var count = getEventCountByPref(pref.code);
          var hasCities = Object.keys(cityMap[pref.code] || {}).length > 1;

          var wrapper = document.createElement('span');
          wrapper.style.cssText = 'display:inline-flex;align-items:center;gap:0;margin:0 0 0 0';

          var btn = document.createElement('button');
          btn.className = 'pref-filter-btn' + (hasCities ? '' : ' no-expand');
          btn.textContent = pref.name + ' (' + count + ')';
          btn.dataset.code = pref.code;
          btn.type = 'button';
          btn.onclick = (function(code) {
            return function() { togglePref(code); };
          })(pref.code);
          wrapper.appendChild(btn);

          if (hasCities) {
            var expandBtn = document.createElement('button');
            expandBtn.className = 'pref-expand-btn';
            expandBtn.textContent = '+';
            expandBtn.dataset.code = pref.code;
            expandBtn.type = 'button';
            expandBtn.onclick = (function(code) {
              return function(e) {
                e.stopPropagation();
                toggleExpand(code);
              };
            })(pref.code);
            wrapper.appendChild(expandBtn);
          }

          prefContainer.appendChild(wrapper);
        }

        regionDiv.appendChild(prefContainer);

        // 各都道府県の市区コンテナ（非表示）
        for (var j = 0; j < region.prefs.length; j++) {
          var pref = region.prefs[j];
          var cityContainer = document.createElement('div');
          cityContainer.id = 'city-container-' + pref.code.replace('-', '');
          cityContainer.style.cssText = 'display:none;flex-wrap:wrap;gap:4px;padding:6px 0 6px 12px';
          regionDiv.appendChild(cityContainer);
        }

        container.appendChild(regionDiv);
      }

      // クリアボタン
      var clearDiv = document.createElement('div');
      clearDiv.style.cssText = 'margin-top:8px';
      var clearBtn = document.createElement('button');
      clearBtn.textContent = 'クリア';
      clearBtn.type = 'button';
      clearBtn.style.cssText = 'background:none;border:1px solid var(--border);color:var(--text-muted);padding:4px 12px;border-radius:var(--radius);font-size:11px;font-family:var(--font-mono);cursor:pointer;transition:all 0.15s';
      clearBtn.onmouseover = function() { clearBtn.style.borderColor = 'var(--accent)'; clearBtn.style.color = 'var(--accent)'; };
      clearBtn.onmouseout = function() { clearBtn.style.borderColor = 'var(--border)'; clearBtn.style.color = 'var(--text-muted)'; };
      clearBtn.onclick = clearAll;
      clearDiv.appendChild(clearBtn);
      container.appendChild(clearDiv);
    }

    function updateCityDisplay(prefCode) {
      var container = document.getElementById('city-container-' + prefCode.replace('-', ''));
      if (!container) return;

      if (expandedPrefs.has(prefCode)) {
        container.style.display = 'flex';
        container.innerHTML = '';
        var cities = Object.keys(cityMap[prefCode] || {}).sort();
        cities.forEach(function(cityName) {
          var count = cityMap[prefCode][cityName].length;
          var btn = document.createElement('button');
          btn.className = 'city-filter-btn';
          btn.textContent = cityName + ' (' + count + ')';
          btn.type = 'button';
          if (selectedPrefs[prefCode] && selectedPrefs[prefCode].has(cityName)) {
            btn.classList.add('active');
          }
          btn.onclick = (function(code, name) {
            return function() { toggleCity(code, name); };
          })(prefCode, cityName);
          container.appendChild(btn);
        });
        var expandBtn = document.querySelector('.pref-expand-btn[data-code="' + prefCode + '"]');
        if (expandBtn) expandBtn.textContent = '−';
      } else {
        container.style.display = 'none';
        var expandBtn = document.querySelector('.pref-expand-btn[data-code="' + prefCode + '"]');
        if (expandBtn) expandBtn.textContent = '+';
      }
    }

    function updateButtonStates() {
      document.querySelectorAll('.pref-filter-btn').forEach(function(btn) {
        var code = btn.dataset.code;
        if (selectedPrefs[code]) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
      expandedPrefs.forEach(function(prefCode) {
        updateCityDisplay(prefCode);
      });
      document.querySelectorAll('.pref-expand-btn').forEach(function(btn) {
        var code = btn.dataset.code;
        if (selectedPrefs[code]) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function renderFilteredEvents() {
      var eventList = document.getElementById('event-list');
      var filteredCount = document.getElementById('filtered-count');

      var prefCodes = Object.keys(selectedPrefs);
      var filtered;
      if (prefCodes.length === 0) {
        filtered = allEvents;
      } else {
        filtered = allEvents.filter(function(e) {
          var store = allStores[e.organizer_id] || {};
          var pref = e.pref_code || '';
          var city = normalizeCity(store.city || e.city_code || '');
          if (!selectedPrefs[pref]) return false;
          return selectedPrefs[pref].has(city);
        });
      }

      if (prefCodes.length > 0) {
        filteredCount.textContent = 'フィルタ結果: ' + filtered.length + '件';
        filteredCount.style.display = 'block';
      } else {
        filteredCount.style.display = 'none';
      }

      eventList.innerHTML = '';
      if (filtered.length === 0) {
        var emptyDiv = document.createElement('div');
        emptyDiv.style.cssText = 'text-align:center;padding:40px;color:var(--text-muted)';
        emptyDiv.textContent = 'イベントが見つかりません';
        eventList.appendChild(emptyDiv);
      } else {
        for (var i = 0; i < filtered.length; i++) {
          eventList.appendChild(renderEventRow(filtered[i]));
        }
      }
    }

    function getUrlParam(name) {
      var url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    async function init() {
      GCG.init();
      document.getElementById('header').innerHTML = GCG.renderHeader('schedule');
      document.getElementById('footer').innerHTML = GCG.renderFooter();

      var seriesId = getUrlParam('series_id');
      if (!seriesId) {
        document.getElementById('loading').textContent = 'シリーズIDが指定されていません';
        document.getElementById('loading').style.color = '#ff5050';
        var errorLink = document.createElement('div');
        errorLink.style.cssText = 'margin-top:16px';
        var link = document.createElement('a');
        link.href = 'schedule.html';
        link.textContent = 'スケジュールに戻る';
        link.style.cssText = 'color:var(--accent);text-decoration:none';
        errorLink.appendChild(link);
        document.getElementById('loading').parentNode.insertBefore(errorLink, document.getElementById('loading').nextSibling);
        return;
      }

      try {
        var res = await fetch('data/schedule.json');
        var data = await res.json();

        allStores = data.stores || {};

        var events = data.events[seriesId] || [];
        var seriesInfo = (data.series || []).find(function(s) { return s.event_series_id == seriesId; });
        var title = seriesInfo ? seriesInfo.event_series_title : 'イベント開催一覧';

        allEvents = events.sort(function(a, b) {
          return new Date(a.start_datetime) - new Date(b.start_datetime);
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('page-title').textContent = title;
        document.getElementById('event-count-badge').textContent = allEvents.length + '件';

        buildCityMap();
        renderRegionFilter();
        renderFilteredEvents();
      } catch(e) {
        document.getElementById('loading').textContent = 'イベント情報の取得に失敗しました: ' + e.message;
        document.getElementById('loading').style.color = '#ff5050';
      }
    }

    init();
  </script>
</body>
</html>
