  <style>
    /* 地域・都道府県の折りたたみ表示 */
    .stores-collapsible details {
      margin: 0;
    }
    .stores-collapsible details > summary {
      cursor: pointer;
      list-style: none;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.12s;
      padding: 4px 8px;
      margin: 0 -8px;
      border-radius: 4px;
    }
    .stores-collapsible details > summary::-webkit-details-marker { display: none; }
    .stores-collapsible details > summary::before {
      content: '▼';
      display: inline-block;
      color: var(--text-muted);
      font-size: 11px;
      transition: transform 0.15s ease;
      width: 12px;
      flex-shrink: 0;
    }
    .stores-collapsible details:not([open]) > summary::before {
      transform: rotate(-90deg);
    }
    .stores-collapsible details > summary:hover {
      background: var(--bg-elevated);
    }
    .stores-collapsible details > summary > * {
      margin: 0;
      flex: 1;
    }
    .stores-collapsible .region-block {
      margin: 24px 0;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .stores-collapsible .region-block:last-child { border-bottom: none; }
    .stores-collapsible .region-block > summary > h2 {
      font-size: 18px;
      font-weight: 700;
    }
    .stores-collapsible .pref-block {
      margin: 12px 0 12px 24px;
    }
    .stores-collapsible .pref-block > summary > h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
    }
    .stores-collapsible .pref-block > .store-grid {
      margin-top: 8px;
      margin-left: 4px;
    }
    /* ショップバトル関連 */
    .sb-highlight {
      margin-bottom: 24px; padding: 20px; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: var(--radius-lg);
    }
    .sb-top3-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px;
    }
    .sb-top3-card {
      padding: 12px; background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 6px; transition: border-color 0.15s;
    }
    .sb-top3-card:hover { border-color: var(--accent); }
    .sb-badge {
      display: inline-flex; align-items: baseline; gap: 6px;
      margin-top: 8px; padding: 4px 10px;
      background: linear-gradient(135deg, rgba(68, 187, 255, 0.12), rgba(68, 187, 255, 0.05));
      border: 1px solid rgba(68, 187, 255, 0.3);
      border-radius: 4px; font-family: var(--font-mono); font-size: 11px;
    }
    .sb-badge-label { color: var(--text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .sb-badge-value { color: #44bbff; font-weight: 700; font-size: 13px; }
    .sb-badge-count { color: var(--text-muted); font-size: 10px; }
    /* 開催履歴 折りたたみセクション */
    .sb-history-toggle { margin-top: 8px; font-family: var(--font-mono); font-size: 11px; }
    .sb-history-toggle summary { cursor: pointer; color: var(--accent); padding: 4px 0; list-style: none; user-select: none; }
    .sb-history-toggle summary::-webkit-details-marker { display: none; }
    .sb-history-toggle summary::before { content: '\25B6 '; display: inline-block; transition: transform 0.15s; }
    .sb-history-toggle[open] summary::before { transform: rotate(90deg); }
    .sb-history-list { margin-top: 6px; padding: 8px; background: var(--bg-elevated); border-radius: 4px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 11px; }
    .sb-history-date { color: var(--text-secondary); }
    .sb-history-count { color: #44bbff; font-weight: 700; text-align: right; }
    .sb-history-note { margin-top: 8px; padding: 6px 8px; background: rgba(255, 170, 0, 0.08); border-left: 2px solid rgba(255, 170, 0, 0.5); border-radius: 2px; font-size: 10px; color: var(--text-muted); line-height: 1.4; }
    .sb-data-disclaimer { margin-bottom: 24px; padding: 10px 14px; background: rgba(255,170,0,0.06); border-left: 3px solid rgba(255,170,0,0.4); border-radius: 2px; font-size: 12px; color: var(--text-muted); line-height: 1.6; display: none; }

    .stores-collapsible .toggle-bar {
      display: flex;
      gap: 8px;
      margin: 0 0 12px;
    }
    .stores-collapsible .toggle-bar button {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.12s, border-color 0.12s;
    }
    .stores-collapsible .toggle-bar button:hover {
      background: var(--bg-card);
      border-color: var(--accent);
    }
  </style>

<body>
  <div id="header"></div>

  <main class="container">
    <div id="breadcrumb"></div>

    <div class="section-header">
      <h1 class="section-title">店舗一覧</h1>
      <span class="section-badge" id="store-count">--</span>
    </div>
    <p style="color:var(--text-muted);font-size:13px;margin:0 0 16px">
      ガンダムカードゲーム公式トーナメントの開催実績がある店舗の一覧。店舗名・住所で検索できます。
    </p>

    <section class="sb-highlight" id="sb-highlight-section" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <h2 id="sb-highlight-title" style="font-size:14px;font-family:var(--font-mono);color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin:0">
          読み込み中...
        </h2>
        <a href="/regions.html" style="color:var(--accent);text-decoration:none;font-size:12px">
          地域別ランキング &rarr;
        </a>
      </div>
      <div id="sb-top3-cards" class="sb-top3-grid"></div>
    </section>
    <div class="sb-data-disclaimer" id="sb-disclaimer"></div>

    <div class="filter-bar" style="margin-bottom:16px;flex-wrap:wrap">
      <input type="search" class="filter-input" id="store-search" placeholder="店舗名・住所で検索..." style="flex:1;min-width:200px">
      <select id="region-filter" class="filter-input" style="min-width:140px">
        <option value="">すべての地域</option>
      </select>
      <select id="pref-filter" class="filter-input" style="min-width:140px">
        <option value="">すべての都道府県</option>
      </select>
      <select id="city-filter" class="filter-input" style="min-width:140px" disabled>
        <option value="">すべてのエリア</option>
      </select>
      <select id="sort-by" class="filter-input" style="min-width:140px">
        <option value="prefecture">都道府県順</option>
        <option value="name">店舗名（あいうえお順）</option>
        <option value="sb-avg">SB平均参加者数順</option>
        <option value="sb-count">SB開催回数順</option>
        <option value="sb-total">SB総参加者数順</option>
      </select>
    </div>

    <div id="stores-root" class="stores-collapsible" data-state="loading">
      <div style="text-align:center;padding:48px;color:var(--text-muted);font-size:13px">読み込み中...</div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="/js/common.js?v=10"></script>
  <script>
    // 都道府県コードの辞書（ISO 3166-2 形式。data/schedule.json の pref_code に一致）
    const PREF_MAP = {
      'JP-01':'北海道','JP-02':'青森県','JP-03':'岩手県','JP-04':'宮城県','JP-05':'秋田県','JP-06':'山形県','JP-07':'福島県',
      'JP-08':'茨城県','JP-09':'栃木県','JP-10':'群馬県','JP-11':'埼玉県','JP-12':'千葉県','JP-13':'東京都','JP-14':'神奈川県',
      'JP-15':'新潟県','JP-16':'富山県','JP-17':'石川県','JP-18':'福井県','JP-19':'山梨県','JP-20':'長野県','JP-21':'岐阜県',
      'JP-22':'静岡県','JP-23':'愛知県','JP-24':'三重県','JP-25':'滋賀県','JP-26':'京都府','JP-27':'大阪府','JP-28':'兵庫県',
      'JP-29':'奈良県','JP-30':'和歌山県','JP-31':'鳥取県','JP-32':'島根県','JP-33':'岡山県','JP-34':'広島県','JP-35':'山口県',
      'JP-36':'徳島県','JP-37':'香川県','JP-38':'愛媛県','JP-39':'高知県','JP-40':'福岡県','JP-41':'佐賀県','JP-42':'長崎県',
      'JP-43':'熊本県','JP-44':'大分県','JP-45':'宮崎県','JP-46':'鹿児島県','JP-47':'沖縄県',
      'CN-HK':'香港'
    };

    // 地域マップ（pref_code → 地域名）。三重県は近畿地方として扱う。香港は「海外」枠。
    const REGION_MAP = {
      'JP-01':'北海道',
      'JP-02':'東北','JP-03':'東北','JP-04':'東北','JP-05':'東北','JP-06':'東北','JP-07':'東北',
      'JP-08':'関東','JP-09':'関東','JP-10':'関東','JP-11':'関東','JP-12':'関東','JP-13':'関東','JP-14':'関東',
      'JP-15':'中部・甲信越','JP-16':'中部・甲信越','JP-17':'中部・甲信越','JP-18':'中部・甲信越','JP-19':'中部・甲信越','JP-20':'中部・甲信越','JP-21':'中部・甲信越','JP-22':'中部・甲信越','JP-23':'中部・甲信越',
      'JP-24':'関西','JP-25':'関西','JP-26':'関西','JP-27':'関西','JP-28':'関西','JP-29':'関西','JP-30':'関西',
      'JP-31':'中国','JP-32':'中国','JP-33':'中国','JP-34':'中国','JP-35':'中国',
      'JP-36':'四国','JP-37':'四国','JP-38':'四国','JP-39':'四国',
      'JP-40':'九州・沖縄','JP-41':'九州・沖縄','JP-42':'九州・沖縄','JP-43':'九州・沖縄','JP-44':'九州・沖縄','JP-45':'九州・沖縄','JP-46':'九州・沖縄','JP-47':'九州・沖縄',
      'CN-HK':'海外'
    };
    // 表示順序（海外＝香港 を最下部に）
    const REGION_ORDER = ['北海道','東北','関東','中部・甲信越','関西','中国','四国','九州・沖縄','海外'];

    // city フィールドから「区／市／町／村」までの先頭部分を抽出（例: "渋谷区宇田川町" → "渋谷区"）
    function extractArea(cityField) {
      if (!cityField) return '';
      const s = String(cityField).replace(/\u3000/g, ' ').trim();
      const m = s.match(/^(.+?[区市町村])/);
      return m ? m[1] : s;
    }

    (async () => {
      document.getElementById('breadcrumb').innerHTML = GCG.renderBreadcrumb([
        { name: 'トップ', href: '/' },
        { name: '店舗一覧' }
      ]);
      document.getElementById('header').innerHTML = GCG.renderHeader('stores');
      document.getElementById('footer').innerHTML = GCG.renderFooter();
      try { GCG.initHeaderSearch(); } catch (e) {}

      const root = document.getElementById('stores-root');

      let schedule;
      try {
        schedule = await fetch('/data/schedule.json').then(r => { if (!r.ok) throw new Error('schedule.json HTTP ' + r.status); return r.json(); });
      } catch (err) {
        root.setAttribute('data-state', 'error');
        root.innerHTML = '<div style="padding:24px;color:var(--text-muted);font-size:13px">データの読み込みに失敗しました（' + GCG.escapeHtml(err.message) + '）。</div>';
        return;
      }

      // ショップバトルデータ読み込み
      let shopbattleData = null;
      let shopbattleLatestMonth = null;
      const shopbattleStoreMap = new Map();
      const shopbattleNameMap = new Map();

      function normalizeStoreName(name) {
        return name.replace(/　/g, '').replace(/\s+/g, '').trim().toLowerCase();
      }

      try {
        const manifest = await fetch('/data/shopbattle/manifest.json').then(r => r.json());
        shopbattleLatestMonth = manifest.latestMonth;
        shopbattleData = await fetch(`/data/shopbattle/${shopbattleLatestMonth}-aggregated.json`)
          .then(r => r.json());

        for (const store of shopbattleData.stores) {
          shopbattleStoreMap.set(String(store.organizerId), store);
          const norm = normalizeStoreName(store.storeName);
          if (norm) shopbattleNameMap.set(norm, store);
        }
      } catch (err) {
        console.warn('ショップバトルデータの読み込み失敗:', err);
      }

      function getShopbattleInfo(storeObj) {
        if (!shopbattleData) return null;
        let info = shopbattleStoreMap.get(String(storeObj.id));
        if (!info) {
          const norm = normalizeStoreName(storeObj.name);
          info = shopbattleNameMap.get(norm);
        }
        return info;
      }

      const stores = [];
      for (const [id, s] of Object.entries(schedule.stores || {})) {
        if (!s || !s.name) continue;
        const normId = String(id);
        const pref_code = s.pref_code || '';
        const storeObj = {
          id: s.id != null ? s.id : normId,
          name: String(s.name).replace(/\u3000/g, ' ').replace(/\s+/g, ' ').trim(),
          pref_code,
          pref: PREF_MAP[pref_code] || '(不明)',
          region: REGION_MAP[pref_code] || '(その他)',
          city: s.city || '',
          area: extractArea(s.city || ''),
          address: s.address || ''
        };
        storeObj.sbInfo = getShopbattleInfo(storeObj);
        stores.push(storeObj);
      }

      // SB紐付けログ
      if (shopbattleData) {
        const sbLinked = stores.filter(s => s.sbInfo).length;
        const sbTotal = shopbattleData.stores.length;
        console.log('SB紐付け: ' + sbLinked + '/' + sbTotal + ' (' + (sbLinked/sbTotal*100).toFixed(1) + '%)');
        const linkedIds = new Set(stores.filter(s => s.sbInfo).map(s => String(s.sbInfo.organizerId)));
        const unlinked = shopbattleData.stores.filter(s => !linkedIds.has(String(s.organizerId)));
        if (unlinked.length > 0) {
          console.warn('SB紐付け失敗 (' + unlinked.length + '件):', unlinked.slice(0, 5).map(s => s.storeName));
        }
      }

      document.getElementById('store-count').textContent = stores.length + ' 店舗';

      // TOP3セクション描画
      renderTop3Section();

      // 地域セレクト
      const regionSelect = document.getElementById('region-filter');
      const presentRegions = REGION_ORDER.filter(r => stores.some(s => s.region === r));
      for (const r of presentRegions) {
        const opt = document.createElement('option');
        opt.value = r;
        opt.textContent = r + ' (' + stores.filter(s => s.region === r).length + ')';
        regionSelect.appendChild(opt);
      }

      const prefSelect = document.getElementById('pref-filter');
      const citySelect = document.getElementById('city-filter');

      function rebuildPrefSelect() {
        const region = regionSelect.value;
        const targets = region ? stores.filter(s => s.region === region) : stores;
        const codes = Array.from(new Set(targets.map(s => s.pref_code).filter(Boolean)));
        // ソート: 海外（CN-）は末尾、それ以外は ISO コード順
        codes.sort((a, b) => {
          const aFor = a.startsWith('JP-') ? 0 : 1;
          const bFor = b.startsWith('JP-') ? 0 : 1;
          if (aFor !== bFor) return aFor - bFor;
          return a.localeCompare(b);
        });
        // current value preserve if still valid
        const cur = prefSelect.value;
        prefSelect.innerHTML = '<option value="">すべての都道府県</option>';
        for (const code of codes) {
          const opt = document.createElement('option');
          opt.value = code;
          opt.textContent = (PREF_MAP[code] || code) + ' (' + targets.filter(s => s.pref_code === code).length + ')';
          prefSelect.appendChild(opt);
        }
        prefSelect.value = codes.includes(cur) ? cur : '';
      }

      function rebuildCitySelect() {
        const pref = prefSelect.value;
        if (!pref) {
          citySelect.innerHTML = '<option value="">すべてのエリア</option>';
          citySelect.disabled = true;
          citySelect.value = '';
          return;
        }
        const targets = stores.filter(s => s.pref_code === pref);
        const areas = Array.from(new Set(targets.map(s => s.area).filter(Boolean)));
        areas.sort((a, b) => a.localeCompare(b, 'ja'));
        const cur = citySelect.value;
        citySelect.innerHTML = '<option value="">すべてのエリア</option>';
        for (const a of areas) {
          const opt = document.createElement('option');
          opt.value = a;
          opt.textContent = a + ' (' + targets.filter(s => s.area === a).length + ')';
          citySelect.appendChild(opt);
        }
        // 「(エリア未登録)」の選択肢
        const unknownCount = targets.filter(s => !s.area).length;
        if (unknownCount > 0) {
          const opt = document.createElement('option');
          opt.value = '__unknown__';
          opt.textContent = '(エリア未登録) (' + unknownCount + ')';
          citySelect.appendChild(opt);
        }
        citySelect.disabled = false;
        citySelect.value = (areas.includes(cur) || cur === '__unknown__') ? cur : '';
      }

      rebuildPrefSelect();
      rebuildCitySelect();

      function applyFilters() {
        const q = (document.getElementById('store-search').value || '').replace(/\u3000/g, ' ').replace(/\s+/g, ' ').trim();
        const region = regionSelect.value;
        const pref = prefSelect.value;
        const city = citySelect.value;
        const sortBy = document.getElementById('sort-by').value;

        let list = stores.slice();
        if (region) list = list.filter(s => s.region === region);
        if (pref) list = list.filter(s => s.pref_code === pref);
        if (city === '__unknown__') list = list.filter(s => !s.area);
        else if (city) list = list.filter(s => s.area === city);
        if (q) {
          list = list.filter(s =>
            (s.name && s.name.indexOf(q) !== -1) ||
            (s.address && s.address.indexOf(q) !== -1) ||
            (s.city && s.city.indexOf(q) !== -1)
          );
        }

        if (sortBy === 'prefecture') {
          list.sort((a, b) => {
            const ra = REGION_ORDER.indexOf(a.region);
            const rb = REGION_ORDER.indexOf(b.region);
            const raFor = ra === -1 ? 999 : ra;
            const rbFor = rb === -1 ? 999 : rb;
            if (raFor !== rbFor) return raFor - rbFor;
            if (a.pref_code !== b.pref_code) return a.pref_code.localeCompare(b.pref_code);
            return a.name.localeCompare(b.name, 'ja');
          });
        } else if (sortBy === 'name') {
          list.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
        } else if (sortBy === 'sb-avg') {
          list.sort((a, b) => (b.sbInfo?.avgParticipants || 0) - (a.sbInfo?.avgParticipants || 0) || (b.sbInfo?.eventCount || 0) - (a.sbInfo?.eventCount || 0));
        } else if (sortBy === 'sb-count') {
          list.sort((a, b) => (b.sbInfo?.eventCount || 0) - (a.sbInfo?.eventCount || 0) || (b.sbInfo?.avgParticipants || 0) - (a.sbInfo?.avgParticipants || 0));
        } else if (sortBy === 'sb-total') {
          list.sort((a, b) => (b.sbInfo?.totalParticipants || 0) - (a.sbInfo?.totalParticipants || 0) || (b.sbInfo?.eventCount || 0) - (a.sbInfo?.eventCount || 0));
        }

        render(list, sortBy);
      }

      function render(list, sortBy) {
        if (list.length === 0) {
          root.innerHTML = '<div style="padding:48px;text-align:center;color:var(--text-muted);font-size:13px">該当する店舗がありません</div>';
          return;
        }

        if (sortBy === 'prefecture') {
          // 地域 → 都道府県 の 2 段。各見出しは <details><summary> で折りたたみ可能
          // まず list を 地域 → 都道府県 にグループ化
          const regionGroups = {};
          for (const s of list) {
            if (!regionGroups[s.region]) regionGroups[s.region] = { stores: [], prefMap: {} };
            regionGroups[s.region].stores.push(s);
            if (!regionGroups[s.region].prefMap[s.pref_code]) regionGroups[s.region].prefMap[s.pref_code] = [];
            regionGroups[s.region].prefMap[s.pref_code].push(s);
          }

          // 表示順序を REGION_ORDER に従う（list は事前にソート済みだが、グループ単位で順序保証）
          const regionsInOrder = REGION_ORDER.filter(r => regionGroups[r]);

          let html = '<div class="toggle-bar">'
            + '<button type="button" id="expand-all">全て展開</button>'
            + '<button type="button" id="collapse-all">全て折りたたみ</button>'
            + '</div>';

          for (const region of regionsInOrder) {
            const grp = regionGroups[region];
            const prefCodes = Object.keys(grp.prefMap).sort();
            let prefHtml = '';
            for (const code of prefCodes) {
              const ps = grp.prefMap[code];
              const prefName = PREF_MAP[code] || code;
              prefHtml += '<details class="pref-block" open>'
                + '<summary><h3>' + GCG.escapeHtml(prefName) + ' <span style="color:var(--text-muted);font-weight:400">（' + ps.length + '店舗）</span></h3></summary>'
                + '<div class="store-grid">' + ps.map(renderStoreRow).join('') + '</div>'
                + '</details>';
            }
            html += '<details class="region-block" open>'
              + '<summary><h2>' + GCG.escapeHtml(region) + ' <span style="font-size:13px;color:var(--text-muted);font-weight:400">（' + grp.stores.length + '店舗）</span></h2></summary>'
              + '<div class="region-content">' + prefHtml + '</div>'
              + '</details>';
          }
          root.innerHTML = html;

          // Toggle handlers
          const expandBtn = document.getElementById('expand-all');
          const collapseBtn = document.getElementById('collapse-all');
          if (expandBtn) expandBtn.addEventListener('click', () => {
            root.querySelectorAll('details').forEach(d => d.open = true);
          });
          if (collapseBtn) collapseBtn.addEventListener('click', () => {
            root.querySelectorAll('details').forEach(d => d.open = false);
          });
        } else if (sortBy.startsWith('sb-')) {
          // SB系ソート: SBデータありの店舗を先に、なしの店舗を後に
          root.innerHTML = '<div class="store-grid">' + list.map(renderStoreRow).join('') + '</div>';
        } else {
          root.innerHTML = '<div class="store-grid">' + list.map(renderStoreRow).join('') + '</div>';
        }
      }

      function formatDateWithDayOfWeek(dateStr) {
        if (!dateStr || dateStr.length < 10) return dateStr || '';
        var parts = dateStr.substring(0, 10).split('-');
        var y = parseInt(parts[0]), m = parseInt(parts[1]), d = parseInt(parts[2]);
        var dt = new Date(y, m - 1, d);
        var days = ['日', '月', '火', '水', '木', '金', '土'];
        return m + '/' + d + ' (' + days[dt.getDay()] + ')';
      }

      function renderShopbattleHistory(sbInfo) {
        if (!sbInfo || !sbInfo.events || sbInfo.events.length === 0) return '';
        var events = sbInfo.events.slice().sort(function(a, b) {
          return (a.date || '').localeCompare(b.date || '');
        });
        var rows = events.map(function(ev) {
          var dayLabel = formatDateWithDayOfWeek(ev.date);
          var p = ev.participants || 0;
          return '<span class="sb-history-date">' + GCG.escapeHtml(dayLabel) + '</span>'
            + '<span class="sb-history-count">' + p + '名</span>';
        }).join('');
        var monthLabel = (sbInfo.events[0] && sbInfo.events[0].date || '2026-04').substring(0, 7);
        var monthDisplay = monthLabel.replace('-', '年') + '月';
        return '<details class="sb-history-toggle" onclick="event.stopPropagation();event.preventDefault();">'
          + '<summary>' + monthDisplay + 'の開催履歴 (' + events.length + '件)</summary>'
          + '<div class="sb-history-list">' + rows + '</div>'
          + '<div class="sb-history-note">※予定登録ベースのため、一部開催が欠損している可能性があります</div>'
          + '</details>';
      }

      function renderStoreRow(s) {
        var href = '/store.html?id=' + encodeURIComponent(s.id);
        var sbBadge = s.sbInfo
          ? '<div class="sb-badge" title="' + shopbattleLatestMonth + ' ショップバトル">'
            + '<span class="sb-badge-label">' + shopbattleLatestMonth.split('-')[1] + '月SB</span>'
            + '<span class="sb-badge-value">平均' + s.sbInfo.avgParticipants + '名</span>'
            + '<span class="sb-badge-count">' + s.sbInfo.eventCount + '回</span>'
            + '</div>'
          : '';
        var sbHistory = (s.sbInfo && s.sbInfo.eventCount >= 2) ? renderShopbattleHistory(s.sbInfo) : '';
        return '<div class="store-row" style="display:block">'
          + '<a href="' + href + '" style="text-decoration:none;color:inherit">'
          + '<div class="store-row-name">' + GCG.escapeHtml(s.name) + '</div>'
          + '<div class="store-row-sub">' + GCG.escapeHtml(s.pref) + (s.city ? ' ' + GCG.escapeHtml(s.city) : '') + '</div>'
          + sbBadge
          + '</a>'
          + sbHistory
          + '</div>';
      }

      function renderTop3Section() {
        const section = document.getElementById('sb-highlight-section');
        if (!shopbattleData) return;
        section.style.display = '';

        const monthDisplay = shopbattleLatestMonth.replace('-', '年') + '月';
        document.getElementById('sb-highlight-title').textContent =
          monthDisplay + ' 複数回開催 盛り上がり店舗 TOP 3';

        const top3 = shopbattleData.stores
          .filter(s => s.eventCount >= 2)
          .sort((a, b) => b.avgParticipants - a.avgParticipants || b.eventCount - a.eventCount)
          .slice(0, 3);

        if (top3.length === 0) {
          document.getElementById('sb-top3-cards').innerHTML =
            '<div style="color:var(--text-muted);font-size:13px">複数回開催のデータが集まり次第表示されます</div>';
          return;
        }

        const colors = ['#ffd700', '#c0c0c0', '#cd7f32'];
        const html = top3.map((s, i) =>
          '<div class="sb-top3-card">'
          + '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px">'
          + '<span style="font-size:18px;font-weight:700;color:' + colors[i] + '">' + (i + 1) + '位</span>'
          + '<span style="font-size:13px;font-weight:600">' + GCG.escapeHtml(s.storeName) + '</span>'
          + '</div>'
          + '<div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono)">'
          + GCG.escapeHtml(s.prefName)
          + '</div>'
          + '<div style="margin-top:6px;font-size:13px">'
          + '<span style="font-weight:700;color:#44bbff">平均 ' + s.avgParticipants + '名</span>'
          + '<span style="color:var(--text-muted);font-size:11px;margin-left:6px">/ ' + s.eventCount + '回開催</span>'
          + '</div>'
          + '</div>'
        ).join('');

        document.getElementById('sb-top3-cards').innerHTML = html;

        // 注意書き表示
        var disclaimer = document.getElementById('sb-disclaimer');
        if (disclaimer) {
          var md = shopbattleLatestMonth.replace('-', '年') + '月';
          disclaimer.textContent = '※' + md + '分は予定登録ベースのデータです。「毎週開催」の店舗の一部開催が欠損している可能性があります。5月以降は完全データを取得予定。';
          disclaimer.style.display = '';
        }
      }

      // イベントリスナ
      document.getElementById('store-search').addEventListener('input', applyFilters);
      regionSelect.addEventListener('change', () => {
        // 地域変更時、都道府県・エリアをリセット → 再構築 → 適用
        prefSelect.value = '';
        citySelect.value = '';
        rebuildPrefSelect();
        rebuildCitySelect();
        applyFilters();
      });
      prefSelect.addEventListener('change', () => {
        // 都道府県変更時、エリアをリセット → 再構築 → 適用
        // 都道府県を選んだ場合、地域は自動連動（推測）
        if (prefSelect.value && !regionSelect.value) {
          const region = REGION_MAP[prefSelect.value];
          if (region && Array.from(regionSelect.options).some(o => o.value === region)) {
            regionSelect.value = region;
            rebuildPrefSelect();
            // 再選択
            prefSelect.value = prefSelect.value;
          }
        }
        citySelect.value = '';
        rebuildCitySelect();
        applyFilters();
      });
      citySelect.addEventListener('change', applyFilters);
      document.getElementById('sort-by').addEventListener('change', applyFilters);

      applyFilters();
      root.setAttribute('data-state', 'ready');
    })();
  </script>
</body>
</html>
