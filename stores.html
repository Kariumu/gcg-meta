<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3MY17P4E7F"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-3MY17P4E7F');
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店舗一覧 | GCG STATS</title>
  <meta name="description" content="ガンダムカードゲーム公式トーナメントの開催実績がある店舗の一覧。都道府県別に表示し、検索・並び替えが可能です。">
  <link rel="canonical" href="https://gcg-stats.com/stores.html">
  <meta property="og:site_name" content="GCG STATS">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:title" content="店舗一覧 | GCG STATS">
  <meta property="og:description" content="ガンダムカードゲーム公式トーナメントの開催実績がある店舗の一覧。都道府県別に表示し、検索・並び替えが可能です。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://gcg-stats.com/stores.html">
  <meta property="og:image" content="https://gcg-stats.com/images/ogp-default.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "トップ", "item": "https://gcg-stats.com/" },
      { "@type": "ListItem", "position": 2, "name": "店舗一覧" }
    ]
  }
  </script>
</head>
<body>
  <div id="header"></div>

  <main class="container">
    <div id="breadcrumb"></div>

    <div class="section-header">
      <h1 class="section-title">店舗一覧</h1>
      <span class="section-badge" id="store-count">--</span>
    </div>
    <p style="color:var(--text-muted);font-size:13px;margin:0 0 16px">
      ガンダムカードゲーム公式トーナメントの開催実績がある店舗の一覧。店舗名・住所で検索できます。
    </p>

    <div class="filter-bar" style="margin-bottom:16px">
      <input type="search" class="filter-input" id="store-search" placeholder="店舗名・住所で検索..." style="flex:1;min-width:200px">
      <select id="pref-filter" class="filter-input" style="min-width:140px">
        <option value="">すべての都道府県</option>
      </select>
      <select id="sort-by" class="filter-input" style="min-width:140px">
        <option value="prefecture">都道府県順</option>
        <option value="count_desc">開催実績が多い順</option>
        <option value="latest_desc">直近開催が新しい順</option>
        <option value="name">店舗名（あいうえお順）</option>
      </select>
    </div>

    <div id="stores-root" data-state="loading">
      <div style="text-align:center;padding:48px;color:var(--text-muted);font-size:13px">読み込み中...</div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="/js/common.js"></script>
  <script>
    // 都道府県コードの辞書（JIS X 0401）
    const PREF_MAP = {
      '01':'北海道','02':'青森県','03':'岩手県','04':'宮城県','05':'秋田県','06':'山形県','07':'福島県',
      '08':'茨城県','09':'栃木県','10':'群馬県','11':'埼玉県','12':'千葉県','13':'東京都','14':'神奈川県',
      '15':'新潟県','16':'富山県','17':'石川県','18':'福井県','19':'山梨県','20':'長野県','21':'岐阜県',
      '22':'静岡県','23':'愛知県','24':'三重県','25':'滋賀県','26':'京都府','27':'大阪府','28':'兵庫県',
      '29':'奈良県','30':'和歌山県','31':'鳥取県','32':'島根県','33':'岡山県','34':'広島県','35':'山口県',
      '36':'徳島県','37':'香川県','38':'愛媛県','39':'高知県','40':'福岡県','41':'佐賀県','42':'長崎県',
      '43':'熊本県','44':'大分県','45':'宮崎県','46':'鹿児島県','47':'沖縄県'
    };

    (async () => {
      document.getElementById('breadcrumb').innerHTML = GCG.renderBreadcrumb([
        { name: 'トップ', href: '/' },
        { name: '店舗一覧' }
      ]);
      document.getElementById('header').innerHTML = GCG.renderHeader('stores');
      document.getElementById('footer').innerHTML = GCG.renderFooter();
      try { GCG.initHeaderSearch(); } catch (e) {}

      const root = document.getElementById('stores-root');

      let schedule, events;
      try {
        const [s, e] = await Promise.all([
          fetch('/data/schedule.json').then(r => { if (!r.ok) throw new Error('schedule.json HTTP ' + r.status); return r.json(); }),
          fetch('/data/events.json').then(r => { if (!r.ok) throw new Error('events.json HTTP ' + r.status); return r.json(); })
        ]);
        schedule = s; events = e;
      } catch (err) {
        root.setAttribute('data-state', 'error');
        root.innerHTML = '<div style="padding:24px;color:var(--text-muted);font-size:13px">データの読み込みに失敗しました（' + GCG.escapeHtml(err.message) + '）。</div>';
        return;
      }

      // 店舗毎の開催実績を集計
      const storeStats = {};
      for (const ev of Object.values(events.events || {})) {
        if (!ev.store_id) continue;
        const id = String(ev.store_id);
        if (!storeStats[id]) storeStats[id] = { count: 0, latest: null };
        storeStats[id].count++;
        if (!storeStats[id].latest || ev.date > storeStats[id].latest) {
          storeStats[id].latest = ev.date;
        }
      }

      const stores = [];
      for (const [id, s] of Object.entries(schedule.stores || {})) {
        if (!s || !s.name) continue;
        const normId = String(id);
        stores.push({
          id: s.id != null ? s.id : normId,
          name: String(s.name).replace(/\u3000/g, ' ').replace(/\s+/g, ' ').trim(),
          rawName: s.name,
          pref_code: s.pref_code || '',
          pref: PREF_MAP[s.pref_code] || '(不明)',
          city: s.city || '',
          address: s.address || '',
          stats: storeStats[normId] || { count: 0, latest: null }
        });
      }

      document.getElementById('store-count').textContent = stores.length + ' 店舗';

      // 都道府県セレクト（実在する pref だけ）
      const prefSelect = document.getElementById('pref-filter');
      const prefCodes = Array.from(new Set(stores.map(s => s.pref_code).filter(Boolean))).sort();
      for (const code of prefCodes) {
        const opt = document.createElement('option');
        opt.value = code;
        opt.textContent = (PREF_MAP[code] || code) + ' (' + stores.filter(s => s.pref_code === code).length + ')';
        prefSelect.appendChild(opt);
      }

      function applyFilters() {
        const q = (document.getElementById('store-search').value || '').replace(/\u3000/g, ' ').replace(/\s+/g, ' ').trim();
        const pref = document.getElementById('pref-filter').value;
        const sortBy = document.getElementById('sort-by').value;

        let list = stores.slice();
        if (pref) list = list.filter(s => s.pref_code === pref);
        if (q) {
          list = list.filter(s =>
            (s.name && s.name.indexOf(q) !== -1) ||
            (s.address && s.address.indexOf(q) !== -1) ||
            (s.city && s.city.indexOf(q) !== -1)
          );
        }

        if (sortBy === 'prefecture') {
          list.sort((a, b) => {
            if (a.pref_code !== b.pref_code) return a.pref_code.localeCompare(b.pref_code);
            return a.name.localeCompare(b.name, 'ja');
          });
        } else if (sortBy === 'count_desc') {
          list.sort((a, b) => (b.stats.count || 0) - (a.stats.count || 0) || a.name.localeCompare(b.name, 'ja'));
        } else if (sortBy === 'latest_desc') {
          list.sort((a, b) => (b.stats.latest || '').localeCompare(a.stats.latest || '') || a.name.localeCompare(b.name, 'ja'));
        } else if (sortBy === 'name') {
          list.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
        }

        render(list, sortBy);
      }

      function render(list, sortBy) {
        if (list.length === 0) {
          root.innerHTML = '<div style="padding:48px;text-align:center;color:var(--text-muted);font-size:13px">該当する店舗がありません</div>';
          return;
        }

        if (sortBy === 'prefecture') {
          // 都道府県でグルーピング
          const groups = {};
          for (const s of list) {
            if (!groups[s.pref_code]) groups[s.pref_code] = [];
            groups[s.pref_code].push(s);
          }
          let html = '';
          for (const code of Object.keys(groups).sort()) {
            const g = groups[code];
            html += '<section style="margin:24px 0">'
              + '<h2 style="font-size:14px;color:var(--accent);margin:16px 0 8px">' + GCG.escapeHtml(PREF_MAP[code] || code) + '（' + g.length + '店舗）</h2>'
              + '<div class="store-grid">'
              + g.map(renderStoreRow).join('')
              + '</div></section>';
          }
          root.innerHTML = html;
        } else {
          root.innerHTML = '<div class="store-grid">' + list.map(renderStoreRow).join('') + '</div>';
        }
      }

      function renderStoreRow(s) {
        const href = '/store.html?id=' + encodeURIComponent(s.id);
        const count = s.stats.count > 0 ? (s.stats.count + '件') : '–';
        const latest = s.stats.latest ? s.stats.latest.replace(/-/g, '/') : '–';
        return '<a href="' + href + '" class="store-row">'
          + '<div class="store-row-name">' + GCG.escapeHtml(s.name) + '</div>'
          + '<div class="store-row-sub">' + GCG.escapeHtml(s.pref) + (s.city ? ' ' + GCG.escapeHtml(s.city) : '') + '</div>'
          + '<div class="store-row-stats">'
          +   '<span>開催: ' + count + '</span>'
          +   '<span>直近: ' + latest + '</span>'
          + '</div>'
          + '</a>';
      }

      document.getElementById('store-search').addEventListener('input', applyFilters);
      document.getElementById('pref-filter').addEventListener('change', applyFilters);
      document.getElementById('sort-by').addEventListener('change', applyFilters);

      applyFilters();
      root.setAttribute('data-state', 'ready');
    })();
  </script>
</body>
</html>
