  <style>
    /* 地域・都道府県の折りたたみ表示 */
    .stores-collapsible details {
      margin: 0;
    }
    .stores-collapsible details > summary {
      cursor: pointer;
      list-style: none;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.12s;
      padding: 4px 8px;
      margin: 0 -8px;
      border-radius: 4px;
    }
    .stores-collapsible details > summary::-webkit-details-marker { display: none; }
    .stores-collapsible details > summary::before {
      content: '▼';
      display: inline-block;
      color: var(--text-muted);
      font-size: 11px;
      transition: transform 0.15s ease;
      width: 12px;
      flex-shrink: 0;
    }
    .stores-collapsible details:not([open]) > summary::before {
      transform: rotate(-90deg);
    }
    .stores-collapsible details > summary:hover {
      background: var(--bg-elevated);

    .stores-collapsible details > summary > * {
      margin: 0;
      flex: 1;
    }
    .stores-collapsible .region-block {
      margin: 24px 0;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .stores-collapsible .region-block:last-child { border-bottom: none; }
    .stores-collapsible .region-block > summary > h2 {
      font-size: 18px;
      font-weight: 700;
    }
    .stores-collapsible .pref-block {
      margin: 12px 0 12px 24px;
    }
    .stores-collapsible .pref-block > summary > h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
    }
    .stores-collapsible .pref-block > .store-grid {
      margin-top: 8px;
      margin-left: 4px;
    }

    .stores-collapsible .toggle-bar {
      display: flex;
      gap: 8px;
      margin: 0 0 12px;
    }
    .stores-collapsible .toggle-bar button {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.12s, border-color 0.12s;
    }
    .stores-collapsible .toggle-bar button:hover {
      background: var(--bg-card);
      border-color: var(--accent);

      font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 999px;

<body>
  <div id="header"></div>

  <main class="container">
    <div id="breadcrumb"></div>

    <div class="section-header">
      <h1 class="section-title">店舗一覧</h1>
      <span class="section-badge" id="store-count">--</span>
    </div>
    <p style="color:var(--text-muted);font-size:13px;margin:0 0 16px">
      ガンダムカードゲーム公式トーナメントの開催実績がある店舗の一覧。店舗名・住所で検索できます。
    </p>


    <div class="filter-bar" style="margin-bottom:16px;flex-wrap:wrap">
      <input type="search" class="filter-input" id="store-search" placeholder="店舗名・住所で検索..." style="flex:1;min-width:200px">
      <select id="region-filter" class="filter-input" style="min-width:140px">
        <option value="">すべての地域</option>
      </select>
      <select id="pref-filter" class="filter-input" style="min-width:140px">
        <option value="">すべての都道府県</option>
      </select>
      <select id="city-filter" class="filter-input" style="min-width:140px" disabled>
        <option value="">すべてのエリア</option>
      </select>
      <select id="sort-by" class="filter-input" style="min-width:140px">
        <option value="prefecture">都道府県順</option>
        <option value="name">店舗名（あいうえお順）</option>
      </select>
      <label class="filter-input" style="display:flex;align-items:center;gap:6px;min-width:auto;cursor:pointer">
        <input type="checkbox" id="expert-only"> エキスパートショップのみ
      </label>
    </div>

    <!-- 現在地から探す（2026-07-15 松岡さん指示: 希望者がボタンで位置情報検索・10km単位の範囲指定） -->
    <div class="filter-bar" style="margin-bottom:6px;flex-wrap:wrap;align-items:center">
      <button type="button" id="geo-search-btn" class="filter-input" style="cursor:pointer;min-width:auto">現在地から探す</button>
      <select id="geo-radius" class="filter-input" style="min-width:110px;display:none" aria-label="検索範囲"></select>
      <button type="button" id="geo-clear-btn" class="filter-input" style="cursor:pointer;min-width:auto;display:none">解除</button>
      <button type="button" id="map-toggle-btn" class="filter-input" style="cursor:pointer;min-width:auto">地図で表示</button>
      <span id="geo-status" style="font-size:12px;color:var(--text-muted)"></span>
    </div>
    <p style="color:var(--text-muted);font-size:11px;margin:0 0 16px">
      ※位置情報はボタンを押したときのみブラウザから取得し、端末内での距離計算だけに使用します（サーバへの送信・保存はありません）。距離は直線距離です。
    </p>

    <!-- 地図表示（2026-07-15 松岡さん指示: OpenStreetMap+Leaflet、初回表示時のみ読み込み） -->
    <div id="store-map" style="display:none;height:480px;margin-bottom:16px;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden"></div>

    <div id="stores-root" class="stores-collapsible" data-state="loading">
      <div style="text-align:center;padding:48px;color:var(--text-muted);font-size:13px">読み込み中...</div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="/js/common.js?v=15"></script>
  <script>
    // 都道府県コードの辞書（ISO 3166-2 形式。data/schedule.json の pref_code に一致）
    const PREF_MAP = {
      'JP-01':'北海道','JP-02':'青森県','JP-03':'岩手県','JP-04':'宮城県','JP-05':'秋田県','JP-06':'山形県','JP-07':'福島県',
      'JP-08':'茨城県','JP-09':'栃木県','JP-10':'群馬県','JP-11':'埼玉県','JP-12':'千葉県','JP-13':'東京都','JP-14':'神奈川県',
      'JP-15':'新潟県','JP-16':'富山県','JP-17':'石川県','JP-18':'福井県','JP-19':'山梨県','JP-20':'長野県','JP-21':'岐阜県',
      'JP-22':'静岡県','JP-23':'愛知県','JP-24':'三重県','JP-25':'滋賀県','JP-26':'京都府','JP-27':'大阪府','JP-28':'兵庫県',
      'JP-29':'奈良県','JP-30':'和歌山県','JP-31':'鳥取県','JP-32':'島根県','JP-33':'岡山県','JP-34':'広島県','JP-35':'山口県',
      'JP-36':'徳島県','JP-37':'香川県','JP-38':'愛媛県','JP-39':'高知県','JP-40':'福岡県','JP-41':'佐賀県','JP-42':'長崎県',
      'JP-43':'熊本県','JP-44':'大分県','JP-45':'宮崎県','JP-46':'鹿児島県','JP-47':'沖縄県',
      'CN-HK':'香港'
    };

    // 地域マップ（pref_code → 地域名）。三重県は近畿地方として扱う。香港は「海外」枠。
    const REGION_MAP = {
      'JP-01':'北海道',
      'JP-02':'東北','JP-03':'東北','JP-04':'東北','JP-05':'東北','JP-06':'東北','JP-07':'東北',
      'JP-08':'関東','JP-09':'関東','JP-10':'関東','JP-11':'関東','JP-12':'関東','JP-13':'関東','JP-14':'関東',
      'JP-15':'中部・甲信越','JP-16':'中部・甲信越','JP-17':'中部・甲信越','JP-18':'中部・甲信越','JP-19':'中部・甲信越','JP-20':'中部・甲信越','JP-21':'中部・甲信越','JP-22':'中部・甲信越','JP-23':'中部・甲信越',
      'JP-24':'関西','JP-25':'関西','JP-26':'関西','JP-27':'関西','JP-28':'関西','JP-29':'関西','JP-30':'関西',
      'JP-31':'中国','JP-32':'中国','JP-33':'中国','JP-34':'中国','JP-35':'中国',
      'JP-36':'四国','JP-37':'四国','JP-38':'四国','JP-39':'四国',
      'JP-40':'九州・沖縄','JP-41':'九州・沖縄','JP-42':'九州・沖縄','JP-43':'九州・沖縄','JP-44':'九州・沖縄','JP-45':'九州・沖縄','JP-46':'九州・沖縄','JP-47':'九州・沖縄',
      'CN-HK':'海外'
    };
    // 表示順序（海外＝香港 を最下部に）
    const REGION_ORDER = ['北海道','東北','関東','中部・甲信越','関西','中国','四国','九州・沖縄','海外'];

    // city フィールドから「区／市／町／村」までの先頭部分を抽出（例: "渋谷区宇田川町" → "渋谷区"）
    function extractArea(cityField) {
      if (!cityField) return '';
      const s = String(cityField).replace(/\u3000/g, ' ').trim();
      const m = s.match(/^(.+?[区市町村])/);
      return m ? m[1] : s;
    }

    (async () => {
      document.getElementById('breadcrumb').innerHTML = GCG.renderBreadcrumb([
        { name: 'トップ', href: '/' },
        { name: '店舗一覧' }
      ]);
      document.getElementById('header').innerHTML = GCG.renderHeader('stores');
      document.getElementById('footer').innerHTML = GCG.renderFooter();
      try { GCG.initHeaderSearch(); } catch (e) {}

      const root = document.getElementById('stores-root');

      let schedule;
      try {
        schedule = await fetch('/data/schedule.json').then(r => { if (!r.ok) throw new Error('schedule.json HTTP ' + r.status); return r.json(); });
      } catch (err) {
        root.setAttribute('data-state', 'error');
        root.innerHTML = '<div style="padding:24px;color:var(--text-muted);font-size:13px">データの読み込みに失敗しました（' + GCG.escapeHtml(err.message) + '）。</div>';
        return;
      }

      // エキスパートショップ判定用データ読み込み（失敗してもページ全体は壊さない）
      let expertIds = new Set();
      try {
        const expertData = await fetch('/data/expert-shops.json').then(r => { if (!r.ok) throw new Error('expert-shops.json HTTP ' + r.status); return r.json(); });
        expertIds = new Set(expertData.expertStoreIds || []);
      } catch (err) {
        console.warn('エキスパートショップデータの読み込み失敗:', err);
      }

      // 現在地検索の状態（ボタン押下時のみ取得。2026-07-15）
      let userPos = null;

      const stores = [];
      for (const [id, s] of Object.entries(schedule.stores || {})) {
        if (!s || !s.name) continue;
        const normId = String(id);
        const pref_code = s.pref_code || '';
        const storeObj = {
          id: s.id != null ? s.id : normId,
          name: String(s.name).replace(/\u3000/g, ' ').replace(/\s+/g, ' ').trim(),
          pref_code,
          pref: PREF_MAP[pref_code] || '(不明)',
          region: REGION_MAP[pref_code] || '(その他)',
          city: s.city || '',
          area: extractArea(s.city || ''),
          address: s.address || '',
          isExpert: expertIds.has(s.id != null ? s.id : Number(id)),
          // 公式データの geo（x=緯度, y=経度）。現在地検索の距離計算に使用
          lat: (s.geo && typeof s.geo.x === 'number') ? s.geo.x : null,
          lng: (s.geo && typeof s.geo.y === 'number') ? s.geo.y : null
        };
        stores.push(storeObj);
      }

      document.getElementById('store-count').textContent = stores.length + ' 店舗';

      // 地域セレクト
      const regionSelect = document.getElementById('region-filter');
      const presentRegions = REGION_ORDER.filter(r => stores.some(s => s.region === r));
      for (const r of presentRegions) {
        const opt = document.createElement('option');
        opt.value = r;
        opt.textContent = r + ' (' + stores.filter(s => s.region === r).length + ')';
        regionSelect.appendChild(opt);
      }

      const prefSelect = document.getElementById('pref-filter');
      const citySelect = document.getElementById('city-filter');

      function rebuildPrefSelect() {
        const region = regionSelect.value;
        const targets = region ? stores.filter(s => s.region === region) : stores;
        const codes = Array.from(new Set(targets.map(s => s.pref_code).filter(Boolean)));
        // ソート: 海外（CN-）は末尾、それ以外は ISO コード順
        codes.sort((a, b) => {
          const aFor = a.startsWith('JP-') ? 0 : 1;
          const bFor = b.startsWith('JP-') ? 0 : 1;
          if (aFor !== bFor) return aFor - bFor;
          return a.localeCompare(b);
        });
        // current value preserve if still valid
        const cur = prefSelect.value;
        prefSelect.innerHTML = '<option value="">すべての都道府県</option>';
        for (const code of codes) {
          const opt = document.createElement('option');
          opt.value = code;
          opt.textContent = (PREF_MAP[code] || code) + ' (' + targets.filter(s => s.pref_code === code).length + ')';
          prefSelect.appendChild(opt);
        }
        prefSelect.value = codes.includes(cur) ? cur : '';
      }

      function rebuildCitySelect() {
        const pref = prefSelect.value;
        if (!pref) {
          citySelect.innerHTML = '<option value="">すべてのエリア</option>';
          citySelect.disabled = true;
          citySelect.value = '';
          return;
        }
        const targets = stores.filter(s => s.pref_code === pref);
        const areas = Array.from(new Set(targets.map(s => s.area).filter(Boolean)));
        areas.sort((a, b) => a.localeCompare(b, 'ja'));
        const cur = citySelect.value;
        citySelect.innerHTML = '<option value="">すべてのエリア</option>';
        for (const a of areas) {
          const opt = document.createElement('option');
          opt.value = a;
          opt.textContent = a + ' (' + targets.filter(s => s.area === a).length + ')';
          citySelect.appendChild(opt);
        }
        // 「(エリア未登録)」の選択肢
        const unknownCount = targets.filter(s => !s.area).length;
        if (unknownCount > 0) {
          const opt = document.createElement('option');
          opt.value = '__unknown__';
          opt.textContent = '(エリア未登録) (' + unknownCount + ')';
          citySelect.appendChild(opt);
        }
        citySelect.disabled = false;
        citySelect.value = (areas.includes(cur) || cur === '__unknown__') ? cur : '';
      }

      rebuildPrefSelect();
      rebuildCitySelect();

      function applyFilters() {
        const q = (document.getElementById('store-search').value || '').replace(/\u3000/g, ' ').replace(/\s+/g, ' ').trim();
        const region = regionSelect.value;
        const pref = prefSelect.value;
        const city = citySelect.value;
        const sortBy = document.getElementById('sort-by').value;
        const expertOnly = document.getElementById('expert-only').checked;

        let list = stores.slice();
        if (userPos) {
          const radius = parseInt(document.getElementById('geo-radius').value, 10) || 10;
          list = list.filter(s => typeof s._dist === 'number' && s._dist <= radius);
        }
        if (expertOnly) list = list.filter(s => s.isExpert);
        if (region) list = list.filter(s => s.region === region);
        if (pref) list = list.filter(s => s.pref_code === pref);
        if (city === '__unknown__') list = list.filter(s => !s.area);
        else if (city) list = list.filter(s => s.area === city);
        if (q) {
          list = list.filter(s =>
            (s.name && s.name.indexOf(q) !== -1) ||
            (s.address && s.address.indexOf(q) !== -1) ||
            (s.city && s.city.indexOf(q) !== -1)
          );
        }

        if (sortBy === 'prefecture') {
          list.sort((a, b) => {
            const ra = REGION_ORDER.indexOf(a.region);
            const rb = REGION_ORDER.indexOf(b.region);
            const raFor = ra === -1 ? 999 : ra;
            const rbFor = rb === -1 ? 999 : rb;
            if (raFor !== rbFor) return raFor - rbFor;
            if (a.pref_code !== b.pref_code) return a.pref_code.localeCompare(b.pref_code);
            return a.name.localeCompare(b.name, 'ja');
          });
        } else if (sortBy === 'name') {
          list.sort((a, b) => a.name.localeCompare(b.name, 'ja'));
        }
        if (userPos) {
          // 現在地検索中は近い順を優先し、フラット表示にする
          list.sort((a, b) => a._dist - b._dist);
          const radius = parseInt(document.getElementById('geo-radius').value, 10) || 10;
          document.getElementById('geo-status').textContent = '現在地から' + radius + 'km以内: ' + list.length + '店舗（近い順）';
          lastList = list;
          render(list, 'distance');
          if (mapVisible) updateMap();
          return;
        }

        lastList = list;
        render(list, sortBy);
        if (mapVisible) updateMap();
      }

      function render(list, sortBy) {
        if (list.length === 0) {
          root.innerHTML = '<div style="padding:48px;text-align:center;color:var(--text-muted);font-size:13px">該当する店舗がありません</div>';
          return;
        }

        if (sortBy === 'prefecture') {
          // 地域 → 都道府県 の 2 段。各見出しは <details><summary> で折りたたみ可能
          // まず list を 地域 → 都道府県 にグループ化
          const regionGroups = {};
          for (const s of list) {
            if (!regionGroups[s.region]) regionGroups[s.region] = { stores: [], prefMap: {} };
            regionGroups[s.region].stores.push(s);
            if (!regionGroups[s.region].prefMap[s.pref_code]) regionGroups[s.region].prefMap[s.pref_code] = [];
            regionGroups[s.region].prefMap[s.pref_code].push(s);
          }

          // 表示順序を REGION_ORDER に従う（list は事前にソート済みだが、グループ単位で順序保証）
          const regionsInOrder = REGION_ORDER.filter(r => regionGroups[r]);

          let html = '<div class="toggle-bar">'
            + '<button type="button" id="expand-all">全て展開</button>'
            + '<button type="button" id="collapse-all">全て折りたたみ</button>'
            + '</div>';

          for (const region of regionsInOrder) {
            const grp = regionGroups[region];
            const prefCodes = Object.keys(grp.prefMap).sort();
            let prefHtml = '';
            for (const code of prefCodes) {
              const ps = grp.prefMap[code];
              const prefName = PREF_MAP[code] || code;
              prefHtml += '<details class="pref-block" open>'
                + '<summary><h3>' + GCG.escapeHtml(prefName) + ' <span style="color:var(--text-muted);font-weight:400">（' + ps.length + '店舗）</span></h3></summary>'
                + '<div class="store-grid">' + ps.map(renderStoreRow).join('') + '</div>'
                + '</details>';
            }
            html += '<details class="region-block" open>'
              + '<summary><h2>' + GCG.escapeHtml(region) + ' <span style="font-size:13px;color:var(--text-muted);font-weight:400">（' + grp.stores.length + '店舗）</span></h2></summary>'
              + '<div class="region-content">' + prefHtml + '</div>'
              + '</details>';
          }
          root.innerHTML = html;

          // Toggle handlers
          const expandBtn = document.getElementById('expand-all');
          const collapseBtn = document.getElementById('collapse-all');
          if (expandBtn) expandBtn.addEventListener('click', () => {
            root.querySelectorAll('details').forEach(d => d.open = true);
          });
          if (collapseBtn) collapseBtn.addEventListener('click', () => {
            root.querySelectorAll('details').forEach(d => d.open = false);
          });
        } else {
          root.innerHTML = '<div class="store-grid">' + list.map(renderStoreRow).join('') + '</div>';
        }
      }

      function renderStoreRow(s) {
        var href = '/store.html?id=' + encodeURIComponent(s.id);
        var distBadge = '';
        if (userPos && typeof s._dist === 'number') {
          var d = s._dist < 1 ? Math.round(s._dist * 1000) + 'm' : s._dist.toFixed(1) + 'km';
          distBadge = ' <span style="color:var(--accent);font-family:var(--font-mono);font-size:12px">約' + d + '</span>';
        }
        return '<div class="store-row" style="display:block">'
          + '<a href="' + href + '" style="text-decoration:none;color:inherit">'
          + '<div class="store-row-name">' + GCG.escapeHtml(s.name) + (s.isExpert ? ' <span class="expert-badge" title="エキスパートショップ（公認大会開催店）">★エキスパート</span>' : '') + distBadge + '</div>'
          + '<div class="store-row-sub">' + GCG.escapeHtml(s.pref) + (s.city ? ' ' + GCG.escapeHtml(s.city) : '') + '</div>'
          + '</a>'
          + '</div>';
      }

      // === 現在地から探す（2026-07-15 松岡さん指示） ===
      const geoBtn = document.getElementById('geo-search-btn');
      const geoRadius = document.getElementById('geo-radius');
      const geoClear = document.getElementById('geo-clear-btn');
      const geoStatus = document.getElementById('geo-status');
      for (let km = 10; km <= 100; km += 10) {
        const opt = document.createElement('option');
        opt.value = km;
        opt.textContent = km + 'km以内';
        geoRadius.appendChild(opt);
      }
      function haversineKm(lat1, lng1, lat2, lng2) {
        const R = 6371;
        const toRad = (x) => x * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLng = toRad(lng2 - lng1);
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(a));
      }
      geoBtn.addEventListener('click', () => {
        if (!navigator.geolocation) {
          geoStatus.textContent = 'このブラウザは位置情報に対応していません';
          return;
        }
        geoStatus.textContent = '位置情報を取得中...';
        geoBtn.disabled = true;
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            for (const s of stores) {
              s._dist = (s.lat != null && s.lng != null) ? haversineKm(userPos.lat, userPos.lng, s.lat, s.lng) : null;
            }
            geoRadius.style.display = '';
            geoClear.style.display = '';
            geoBtn.disabled = false;
            applyFilters();
          },
          (err) => {
            geoBtn.disabled = false;
            geoStatus.textContent = err.code === 1
              ? '位置情報の利用が許可されませんでした（ブラウザの設定から許可できます）'
              : '位置情報を取得できませんでした';
          },
          { enableHighAccuracy: false, timeout: 10000, maximumAge: 300000 }
        );
      });
      // === 地図表示（2026-07-15 松岡さん指示: OpenStreetMap+Leaflet+クラスタリング） ===
      let lastList = stores.slice();
      let mapVisible = false;
      let leafletReady = false;
      let leafletLoading = false;
      let map = null, clusterGroup = null, posMarker = null, radiusCircle = null;
      const mapDiv = document.getElementById('store-map');
      const mapBtn = document.getElementById('map-toggle-btn');

      function loadLeaflet() {
        // 初回表示時のみCDNから読み込み（通常閲覧のページ速度に影響させない）
        return new Promise((resolve, reject) => {
          if (leafletReady) return resolve();
          const css1 = document.createElement('link');
          css1.rel = 'stylesheet';
          css1.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
          document.head.appendChild(css1);
          const css2 = document.createElement('link');
          css2.rel = 'stylesheet';
          css2.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css';
          document.head.appendChild(css2);
          const css3 = document.createElement('link');
          css3.rel = 'stylesheet';
          css3.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css';
          document.head.appendChild(css3);
          const js1 = document.createElement('script');
          js1.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
          js1.onload = () => {
            const js2 = document.createElement('script');
            js2.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js';
            js2.onload = () => { leafletReady = true; resolve(); };
            js2.onerror = reject;
            document.head.appendChild(js2);
          };
          js1.onerror = reject;
          document.head.appendChild(js1);
        });
      }

      function updateMap() {
        if (!leafletReady || !map) return;
        clusterGroup.clearLayers();
        const markers = [];
        for (const s of lastList) {
          if (s.lat == null || s.lng == null) continue;
          const m = L.circleMarker([s.lat, s.lng], {
            // マゼンタ+白縁: OSMのオレンジ系市街地でも識別しやすい配色（2026-07-15 松岡さん指示）
            radius: 8, color: '#ffffff', weight: 2, fillColor: '#e91e63', fillOpacity: 0.95
          });
          const dist = (userPos && typeof s._dist === 'number')
            ? '<div style="font-family:monospace;font-size:12px">約' + (s._dist < 1 ? Math.round(s._dist * 1000) + 'm' : s._dist.toFixed(1) + 'km') + '</div>' : '';
          m.bindPopup(
            '<div style="min-width:160px"><strong>' + GCG.escapeHtml(s.name) + '</strong>'
            + '<div style="font-size:12px;color:#666">' + GCG.escapeHtml(s.pref) + (s.city ? ' ' + GCG.escapeHtml(s.city) : '') + '</div>'
            + dist
            + '<a href="/store.html?id=' + encodeURIComponent(s.id) + '">店舗ページへ →</a></div>'
          );
          markers.push(m);
        }
        clusterGroup.addLayers(markers);
        if (posMarker) { map.removeLayer(posMarker); posMarker = null; }
        if (radiusCircle) { map.removeLayer(radiusCircle); radiusCircle = null; }
        if (userPos) {
          posMarker = L.circleMarker([userPos.lat, userPos.lng], {
            radius: 9, color: '#ffffff', weight: 2, fillColor: '#4d9ff7', fillOpacity: 0.95
          }).addTo(map).bindPopup('現在地');
          const radius = parseInt(geoRadius.value, 10) || 10;
          radiusCircle = L.circle([userPos.lat, userPos.lng], {
            radius: radius * 1000, color: '#4d9ff7', weight: 1, fillOpacity: 0.05
          }).addTo(map);
          map.fitBounds(radiusCircle.getBounds(), { padding: [20, 20] });
        } else if (markers.length > 0) {
          map.fitBounds(clusterGroup.getBounds(), { padding: [20, 20] });
        } else {
          map.setView([36.5, 138], 5);
        }
      }

      mapBtn.addEventListener('click', async () => {
        if (!mapVisible) {
          if (!leafletReady && !leafletLoading) {
            leafletLoading = true;
            mapBtn.disabled = true;
            mapBtn.textContent = '地図を読み込み中...';
            try {
              await loadLeaflet();
            } catch (e) {
              mapBtn.textContent = '地図を読み込めませんでした';
              mapBtn.disabled = false;
              leafletLoading = false;
              return;
            }
            mapBtn.disabled = false;
            leafletLoading = false;
            map = L.map('store-map');
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
              maxZoom: 19,
              attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
            clusterGroup = L.markerClusterGroup({ chunkedLoading: true, maxClusterRadius: 48 });
            map.addLayer(clusterGroup);
          }
          mapVisible = true;
          mapDiv.style.display = '';
          mapBtn.textContent = '一覧で表示';
          document.getElementById('stores-root').style.display = 'none';
          setTimeout(() => { map.invalidateSize(); updateMap(); }, 50);
        } else {
          mapVisible = false;
          mapDiv.style.display = 'none';
          mapBtn.textContent = '地図で表示';
          document.getElementById('stores-root').style.display = '';
        }
      });

      geoRadius.addEventListener('change', applyFilters);
      geoClear.addEventListener('click', () => {
        userPos = null;
        geoRadius.style.display = 'none';
        geoClear.style.display = 'none';
        geoStatus.textContent = '';
        applyFilters();
      });

      // イベントリスナ
      document.getElementById('store-search').addEventListener('input', applyFilters);
      regionSelect.addEventListener('change', () => {
        // 地域変更時、都道府県・エリアをリセット → 再構築 → 適用
        prefSelect.value = '';
        citySelect.value = '';
        rebuildPrefSelect();
        rebuildCitySelect();
        applyFilters();
      });
      prefSelect.addEventListener('change', () => {
        // 都道府県変更時、エリアをリセット → 再構築 → 適用
        // 都道府県を選んだ場合、地域は自動連動（推測）
        if (prefSelect.value && !regionSelect.value) {
          const region = REGION_MAP[prefSelect.value];
          if (region && Array.from(regionSelect.options).some(o => o.value === region)) {
            regionSelect.value = region;
            rebuildPrefSelect();
            // 再選択
            prefSelect.value = prefSelect.value;
          }
        }
        citySelect.value = '';
        rebuildCitySelect();
        applyFilters();
      });
      citySelect.addEventListener('change', applyFilters);
      document.getElementById('sort-by').addEventListener('change', applyFilters);
      document.getElementById('expert-only').addEventListener('change', applyFilters);

      applyFilters();
      root.setAttribute('data-state', 'ready');
    })();
  </script>
</body>
</html>
